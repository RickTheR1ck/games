<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リックザリック ゲーム置き場</title>
<meta name="description" content="ブラウザですぐ遊べる、くだらないゲームを作っています。リックザリックのゲーム置き場。">
<meta property="og:type" content="website">
<meta property="og:title" content="リックザリック ゲーム置き場">
<meta property="og:description" content="ブラウザですぐ遊べる、くだらないゲームを作っています。">
<meta property="og:url" content="https://rickther1ck.com/">
<meta property="og:image" content="https://rickther1ck.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rickther1ck.com/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: a loud arcade flyer — butter-yellow ground, black ink, white cards with hard offset shadows; header, filter bar, 1–3 column card grid */
:root{
  --ground:#ffd84d;
  --ink:#141414;
  --card:#ffffff;
  --pop:#ff4f8b;
  --sub:#4a4430;
  --line:#141414;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:4px solid var(--line);padding-bottom:20px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.mark{width:58px;height:58px;flex:none;border:4px solid var(--line);border-radius:14px;background:var(--pop);display:grid;place-items:center;
  font-family:var(--display);font-size:30px;color:#fff;box-shadow:4px 4px 0 var(--line);transform:rotate(-6deg)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,6.4vw,44px);line-height:1.05;letter-spacing:.01em}
h1 small{display:block;font-family:var(--body);font-weight:900;font-size:13px;letter-spacing:.18em;margin-top:6px;color:var(--sub)}
.lead{margin:0;max-width:30em;font-weight:700}

/* filter bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:900 13px var(--body);padding:6px 14px;border:3px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.sort{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.sort select{font:700 14px var(--body);padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.count{margin:-14px 0 0;font-size:13px;font-weight:700;color:var(--sub)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px}
.game{display:flex;flex-direction:column;background:var(--card);border:4px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;
  box-shadow:6px 6px 0 var(--line);transition:transform .12s,box-shadow .12s}
.game:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--line)}
.game:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.game:focus-visible{outline:4px solid var(--pop);outline-offset:4px}
.thumb{aspect-ratio:1200/630;height:auto;max-width:100%;border-bottom:4px solid var(--line);background:#222;object-fit:cover;width:100%}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.25;text-wrap:balance}
.info p{margin:0;font-size:14px;color:#333;min-width:0}
.meta{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:6px}
.tag{font-size:12px;font-weight:900;padding:2px 9px;border:2px solid var(--line);border-radius:999px}
.date{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font:900 11px var(--body);letter-spacing:.1em;background:var(--pop);color:#fff;padding:2px 8px;border-radius:4px}

footer{border-top:4px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">R</span>
      <h1>リックザリック<small>ゲーム置き場</small></h1>
    </a>
    <p class="lead">ブラウザですぐ遊べる、くだらないゲームを作っています。登録もインストールもいりません。</p>
  </header>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="タグで絞り込む"></div>
    <label class="sort" for="sort">並び替え
      <select id="sort">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
      </select>
    </label>
  </div>
  <p class="count" id="count"></p>

  <main class="grid" id="grid"></main>

  <footer>
    <span>© 2026 リックザリック</span>
    <span>rickther1ck.com</span>
  </footer>
</div>

<script>
/* ゲームを足すときは、ここに1件追加するだけ。
   slug = GitHubのフォルダ名 / thumb はそのフォルダの og.png を使う */
const GAMES = [
  {
    slug: "trick-or-roulette",
    title: "トリックオアルーレット",
    desc: "「〇〇を〇〇なきゃ〇〇するぞ！」をスロットで決めて、ちょうちんお化けにおどされる。目押しで本家を狙え。",
    tags: ["ハロウィン", "スロット", "1分で遊べる"],
    date: "2026-10-30"
  },
  {
    slug: "unagi",
    title: "ぬめぬめうなぎ掴み",
    desc: "にゅるにゅる逃げるうなぎを、何秒つかんでいられる？ 押すとにぎって上へ、離すとゆるめて下へ。",
    tags: ["3D", "耐久", "1分で遊べる"],
    date: "2026-10-28"
  }
];

const NEW_DAYS = 7;
const grid = document.getElementById('grid'), chips = document.getElementById('chips'), sortSel = document.getElementById('sort'), countEl = document.getElementById('count');
let tag = 'すべて';

const allTags = ['すべて', ...new Set(GAMES.flatMap(g => g.tags))];
chips.innerHTML = allTags.map(t => `<button class="chip" type="button" aria-pressed="${t === tag}">${t}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  tag = b.textContent;
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
sortSel.addEventListener('change', render);

function isNew(d){ return (Date.now() - new Date(d + 'T00:00:00+09:00')) / 864e5 < NEW_DAYS; }
function fmt(d){ const [y,m,dd] = d.split('-'); return `${y}.${m}.${dd}`; }

function render(){
  const list = GAMES.filter(g => tag === 'すべて' || g.tags.includes(tag))
    .sort((a, b) => sortSel.value === 'new' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  countEl.textContent = `${list.length}作品`;
  grid.innerHTML = list.map(g => `
    <a class="game" href="/${g.slug}/">
      <img class="thumb" src="/${g.slug}/og.png" alt="${g.title}の画面" loading="lazy" width="1200" height="630">
      <div class="info">
        ${isNew(g.date) ? '<span class="badge">NEW</span>' : ''}
        <h2>${g.title}</h2>
        <p>${g.desc}</p>
        <div class="meta">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}<span class="date">${fmt(g.date)}</span></div>
      </div>
    </a>`).join('');
}
render();
</script>
</body>
</html>
