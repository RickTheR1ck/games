<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{color-scheme:dark;--ink:#f5f1ea;--sub:#a59fb3;--fire:#ff7a1a;--gold:#ffc83d;--kai:#3dffcf}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c0a12;color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hide{display:none!important}

/* 背景レイヤー */
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 42%,#241d33 0%,#0c0a12 72%);overflow:hidden}
#bg>div{position:absolute;inset:0;opacity:0;transition:opacity 1.6s}
#bg>div.on{opacity:1}
#bgLit{background:radial-gradient(ellipse at 50% 40%,#5a2a12 0%,#1a0c08 55%,#070403 100%)}
#bgUr{background:radial-gradient(ellipse at 50% 42%,#2a1240 0%,#06030b 70%);transition-duration:.4s!important}
#bgSpace{background:radial-gradient(ellipse at 28% 26%,#20185a 0%,#090c26 42%,#010207 100%);transition-duration:3s!important}
#bgDisco{inset:-60%!important;background:conic-gradient(from 0deg,#4a0a5a,#0a1a6a,#6a0a3a,#0a4a4a,#5a4a0a,#4a0a5a);animation:spin 5s linear infinite}
#bgBlack{background:#000;transition-duration:.6s!important}
#bgKai{background:radial-gradient(ellipse at 50% 42%,#0b2a28 0%,#020807 70%);transition-duration:.4s!important}
@keyframes spin{to{transform:rotate(360deg)}}

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1;transition:filter .4s}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;pointer-events:none;z-index:6}
#stats{line-height:1.15}
#stats.glitch{animation:glitch .12s steps(2) infinite}
@keyframes glitch{0%{transform:translate(1px,0);filter:hue-rotate(0)}50%{transform:translate(-2px,1px);filter:hue-rotate(90deg)}100%{transform:translate(1px,-1px)}}
#cnt{font-size:30px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#cnt small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px}
#exp{font-size:11px;color:var(--sub);margin-top:2px}
#ttl{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
#streak{margin-top:6px;font-size:12px;font-weight:800;color:var(--kai);text-shadow:0 0 8px rgba(61,255,207,.5);font-variant-numeric:tabular-nums;transition:opacity .4s}
#streak .m{letter-spacing:1px}
#btns{display:flex;gap:8px;pointer-events:auto}
.pill{height:38px;min-width:38px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .08s}
.pill:active{transform:scale(.94)}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#dexN{font-size:12px;color:var(--gold)}

#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;
  padding:0 14px calc(12px + env(safe-area-inset-bottom));z-index:6;pointer-events:none}
#bottom .pill{pointer-events:auto}
#bAuto.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
#site{font-size:11px;color:var(--sub);text-decoration:none;pointer-events:auto;opacity:.8}

#hint{position:fixed;left:50%;top:50%;transform:translate(70px,-60%);z-index:4;pointer-events:none;
  font-size:17px;font-weight:900;text-shadow:0 2px 10px #000;display:flex;flex-direction:column;align-items:center;gap:2px}
#hint .arw{font-size:30px;animation:arw 1s ease-in-out infinite}
@keyframes arw{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(18px);opacity:0}}

/* 結果カード */
#card{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(92vw,420px);padding:12px 16px 12px;border-radius:16px;z-index:7;pointer-events:none;
  background:rgba(14,12,20,.78);border:2px solid var(--rc,#666);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 40px rgba(0,0,0,.5),0 0 26px var(--rg,transparent);opacity:0}
#card.show{animation:cardIn .32s cubic-bezier(.2,1.6,.4,1) forwards}
#card.glitch{animation:cardGl .09s steps(2) infinite;filter:drop-shadow(3px 0 0 rgba(255,0,60,.8)) drop-shadow(-3px 0 0 rgba(0,220,255,.8))}
@keyframes cardGl{0%{opacity:1;transform:translate(-48%,0) skewX(12deg)}50%{opacity:.6;transform:translate(-53%,3px) skewX(-18deg) scaleY(.85)}100%{opacity:1;transform:translate(-50%,-2px)}}
#crt{position:fixed;inset:0;z-index:12;pointer-events:none;background:#000;opacity:0;display:flex;align-items:center;justify-content:center}
#crt i{display:block;width:100%;height:100%;background:#f4f8ff;box-shadow:0 0 30px 10px rgba(200,230,255,.9)}
#crt.off{opacity:1}
#crt.off i{animation:crtOff .42s cubic-bezier(.6,0,.4,1) forwards}
#crt.fade{transition:opacity .7s;opacity:0}
@keyframes crtOff{0%{transform:scale(1,1);opacity:.9}35%{transform:scale(1,.004);opacity:1}75%{transform:scale(.003,.004);opacity:1}100%{transform:scale(0,0);opacity:0}}
#soma{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
#soma.on{opacity:1}
#soma img{width:min(70vmin,520px);height:min(70vmin,520px);object-fit:contain;opacity:.28;filter:grayscale(.6) sepia(.5) blur(.5px)}
#soma b{position:absolute;top:calc(14% + env(safe-area-inset-top));font-size:min(9vw,44px);font-weight:900;color:rgba(255,235,200,.35);font-variant-numeric:tabular-nums;letter-spacing:.05em}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,24px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#card .top{display:flex;align-items:center;gap:8px}
.rar{font-size:12px;font-weight:900;padding:2px 8px;border-radius:6px;background:var(--rc);color:#111;letter-spacing:.05em;white-space:nowrap}
#card .nm{font-size:22px;font-weight:900}
#card .new{margin-left:auto;font-size:12px;font-weight:900;color:#111;background:#7dff8a;padding:2px 7px;border-radius:6px;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
#card .ds{font-size:13px;color:#d8d2e2;margin-top:4px}
#card .meta{font-size:11px;color:var(--sub);margin-top:5px}
.r0{--rc:#9aa3b2}
.r1{--rc:#4fa3ff;--rg:rgba(79,163,255,.25)}
.r2{--rc:#ffc83d;--rg:rgba(255,200,61,.45)}
.r3{--rc:#ff6bd6;--rg:rgba(255,107,214,.5)}
.r3 .rar{background:linear-gradient(90deg,#ff5f5f,#ffcf3d,#5fff8f,#4fb3ff,#c66bff)}
.r4{--rc:#a860ff;--rg:rgba(168,96,255,.6)}
.r4 .rar{background:#120a1d;color:#d7b3ff;box-shadow:0 0 0 1px #a860ff}
.r5{--rc:#ff7a1a;--rg:rgba(255,122,26,.8)}
.r5 .rar{background:linear-gradient(90deg,#ffe36b,#ff7a1a,#ff2a2a);color:#1a0500}
.r6{--rc:#3dffcf;--rg:rgba(61,255,207,.55)}
.r6 .rar{background:#04140f;color:#3dffcf;box-shadow:0 0 0 1px #3dffcf}

#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}

/* 現象レイヤー */
#rain{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#rain span{position:absolute;top:-12%;font-weight:900;white-space:nowrap;animation:fall linear forwards;text-shadow:0 0 10px currentColor}
@keyframes fall{to{transform:translateY(125vh) rotate(var(--rot,0deg))}}
#veil{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:radial-gradient(circle at var(--vx,50%) var(--vy,52%),rgba(0,0,0,0) 0,rgba(0,0,0,.2) var(--vr,12%),rgba(0,0,0,.97) calc(var(--vr,12%) + 18%))}
#veil.on{opacity:1}
#cracks{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#bubble{position:fixed;z-index:5;pointer-events:none;background:#fff;color:#14111c;font-weight:800;font-size:15px;
  padding:8px 12px;border-radius:14px;transform:translate(-50%,-100%);max-width:min(70vw,260px);text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#banner{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;pointer-events:none;
  padding:7px 16px;border-radius:10px;background:rgba(2,10,9,.75);border:1px solid var(--kai);color:var(--kai);
  font-weight:900;font-size:14px;letter-spacing:.12em;white-space:nowrap;text-shadow:0 0 10px rgba(61,255,207,.6);opacity:0}
#banner.show{animation:ban 3s ease forwards}
#banner small{display:block;font-size:10px;letter-spacing:.2em;opacity:.7;text-align:center}
#banner .nw{color:#fff;margin-left:6px}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-10px) skewX(-8deg)}8%{opacity:1;transform:translate(-50%,0) skewX(0)}80%{opacity:1}100%{opacity:0}}

/* タイトル */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(12vh + env(safe-area-inset-top)) 20px calc(9vh + env(safe-area-inset-bottom));cursor:pointer;
  background:linear-gradient(180deg,rgba(12,10,18,.65),rgba(12,10,18,0) 35%,rgba(12,10,18,0) 65%,rgba(12,10,18,.8))}
#title h1{text-align:center;line-height:1;font-weight:900}
#title h1 .a{display:block;font-size:min(19vw,92px);letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffe58a,#ff8a1f 55%,#ff3b1f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,120,30,.45))}
#title h1 .b{display:block;font-size:min(11vw,52px);margin-top:4px}
#title .sub{margin-top:14px;font-size:15px;color:var(--sub);text-align:center;font-weight:700;text-shadow:0 2px 8px #000}
#title .go{font-size:20px;font-weight:900;padding:14px 34px;border-radius:99px;background:var(--fire);color:#1a0800;
  box-shadow:0 6px 30px rgba(255,122,26,.5);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#title .rec{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}

/* 点火 */
#fireOv{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(5vh + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#fireOv .big{font-size:min(21vw,150px);font-weight:900;line-height:1;white-space:nowrap;letter-spacing:-.02em;
  filter:drop-shadow(0 0 26px rgba(255,120,20,.85)) drop-shadow(0 4px 0 rgba(90,20,0,.6))}
#fireOv .big .ch{display:inline-block;animation:chIn .55s cubic-bezier(.2,1.7,.35,1) backwards;
  background:linear-gradient(180deg,#fff6c2,#ffb030 48%,#ff3a10);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes chIn{from{transform:translateY(-60%) scale(2.4);opacity:0}to{transform:none;opacity:1}}
#fireOv .s{font-size:15px;font-weight:800;margin-top:12px;text-shadow:0 2px 10px #000;text-align:center;line-height:1.5;opacity:0;animation:fadeIn .6s .9s forwards}
#fireOv .s small{display:block;font-size:11px;color:#ffd8a8;opacity:.85;font-weight:700}
@keyframes fadeIn{to{opacity:1}}
#fireOv .act{margin-top:auto;margin-bottom:calc(28px + env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto;opacity:0;animation:fadeIn .5s 1.4s forwards}
/* 着火中・タイトル中はUIを引っ込める */
#hud,#bottom,#hint{transition:opacity .5s}
body.cine #hud,body.cine #bottom,body.cine #hint{opacity:0;pointer-events:none}
body.cine #hud *,body.cine #bottom *{pointer-events:none}
body.titling #stats{opacity:0}
.btnX{background:#000;border:1px solid #444;color:#fff}
.btnFire{background:var(--fire);color:#1a0800;border-color:var(--fire)}

/* 図鑑 */
#dex{position:fixed;inset:0;z-index:30;background:rgba(8,6,12,.95);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
#dex .wrap{max-width:780px;margin:0 auto}
#dex .hd{display:flex;align-items:center;gap:10px}
#dex h2{font-size:24px;font-weight:900}
#dex .x{margin-left:auto}
#dexStats{margin-top:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#dexStats div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px;min-width:0}
#dexStats b{display:block;font-size:18px;font-weight:900;overflow-wrap:anywhere}
#dexStats span{font-size:11px;color:var(--sub)}
#dexTabs{display:flex;gap:8px;margin-top:12px;align-items:center}
#dexTabs .pill.on{background:var(--ink);color:#111;border-color:var(--ink)}
#dexTabs .sp{margin-left:auto}
#dexBar{margin-top:10px;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
#dexBar i{display:block;height:100%;background:linear-gradient(90deg,#ffc83d,#ff7a1a);border-radius:9px;transition:width .4s}
#grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sec{grid-column:1/-1;font-size:13px;font-weight:900;color:var(--sub);margin-top:8px;letter-spacing:.1em}
.cell{border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid color-mix(in srgb,var(--rc) 60%,transparent);
  padding:6px 6px 8px;text-align:center;position:relative;min-width:0}
.cell img,.cell .q{width:100%;aspect-ratio:1;display:block;border-radius:8px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}
.cell .q{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:rgba(255,255,255,.18)}
.cell .rar{position:absolute;left:6px;top:6px;font-size:10px;padding:1px 5px}
.cell .n{font-size:12px;font-weight:800;margin-top:4px;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.cell .c{font-size:10px;color:var(--sub)}
.cell.lock .n{color:rgba(255,255,255,.35)}
.cell.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px}
.cell.wide img,.cell.wide .q{width:96px;flex:none}
.cell.wide .rar{position:static;display:inline-block;margin-bottom:4px}
.cell.wide .n{justify-content:flex-start;min-height:0;font-size:16px}
.ph{border-radius:12px;background:rgba(61,255,207,.05);border:1.5px solid rgba(61,255,207,.35);padding:10px 12px;min-width:0}
.ph.lock{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.ph .n{font-weight:900;font-size:14px;color:var(--kai)}
.ph.lock .n{color:rgba(255,255,255,.35)}
.ph .d{font-size:12px;color:#d8d2e2;margin-top:3px}
.ph .c{font-size:10px;color:var(--sub);margin-top:4px}
#grid.phs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

#dbg{position:fixed;right:8px;top:70px;z-index:40;width:230px;background:rgba(0,0,0,.85);border:1px solid #444;border-radius:10px;
  padding:8px 10px;font-size:11px;max-height:80vh;overflow:auto;touch-action:pan-y}
#dbg label{display:block;margin-top:6px}
#dbg input[type=range]{width:100%}
#dbg .row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#dbg button{background:#333;padding:3px 6px;border-radius:5px;font-size:10px}
#dbg.min>*:not(.tg){display:none}
#dbg .tg{font-weight:900;cursor:pointer}

@media (max-width:520px){
  #dexStats{grid-template-columns:repeat(2,1fr)}
  #dexStats div:last-child{grid-column:span 2}
  #card .nm{font-size:20px}
}
@media (prefers-reduced-motion:reduce){#bgDisco{animation:none}#hint .arw{animation:none}}
</style>
</head>

<div id="veil"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function(){
const DEBUG = /[?&]debug=1/.test(location.search) || location.hash === '#debug';
const SLUG = 'ichiman-lighter';
const GAME_URL = 'https://rickther1ck.com/' + SLUG + '/';
const HASH = '1万分の1ライター';
const $ = id => document.getElementById(id);

// ================= 調整パラメータ =================

function makeEnv(r){
  const es = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 32, 16);
  const cols = []; const pos = g.attributes.position; const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {

    c.setRGB(0.35 + y * 0.45, 0.33 + y * 0.45, 0.42 + y * 0.5);
    if (y < 0) c.setRGB(0.12 - y * 0.05, 0.1, 0.12);

  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));

function radialTex(stops, size){
  size = size || 128;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const DOT = radialTex([[0,'rgba(255,255,255,1)'],[0.3,'rgba(255,255,255,.85)'],[1,'rgba(255,255,255,0)']], 64);
const SOFT = radialTex([[0,'rgba(255,255,255,.95)'],[0.45,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']], 128);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function textTex(lines, w, h, font, color){

}

function jitterGeo(geo, amt, seed){
  const r = mulberry(seed || 1); const p = geo.attributes.position; const map = {};
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(3) + ',' + p.getY(i).toFixed(3) + ',' + p.getZ(i).toFixed(3);
    if (!map[k]) map[k] = 1 + (r() - .5) * 2 * amt;
    const s = map[k]; p.setXYZ(i, p.getX(i) * s, p.getY(i) * s, p.getZ(i) * s);
  }
  geo.computeVertexNormals(); return geo;
}
// ギザギザ（ローレット）の円柱。軸はy
function knurlGeo(r, h, teeth, depth){
  const g = new THREE.CylinderGeometry(r, r, h, teeth * 2, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i); const rr = Math.hypot(x, z); if (rr < 1e-4) continue;
    const a = Math.atan2(z, x); const idx = Math.round(a / (Math.PI * 2) * teeth * 2);
    const k = (((idx % 2) + 2) % 2 === 0) ? 1 : 1 - depth;
    p.setX(i, x / rr * r * k); p.setZ(i, z / rr * r * k);
  }
  g.computeVertexNormals(); return g;
}
function roundedRect(w, h, r){
  const s = new THREE.Shape(); const x = -w/2, y = -h/2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// 角丸四角の断面を y方向に押し出す
function prismY(w, d, r, h, opt){
  const g = new THREE.ExtrudeGeometry(roundedRect(w, d, r), Object.assign({ depth: h, bevelEnabled: false, curveSegments: 10 }, opt || {}));
  g.rotateX(-Math.PI / 2); return g;
}
function tubeY(w, d, r, t, h){
  const s = roundedRect(w, d, r); s.holes.push(roundedRect(w - 2 * t, d - 2 * t, Math.max(.01, r - t)));
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 10 });
  g.rotateX(-Math.PI / 2); return g;
}
function tearGeo(h, r){
  const pts = [];
  for (let i = 0; i <= 26; i++) { const t = i / 26; const rr = r * 1.35 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), .75) * Math.pow(1 - t, .4); pts.push(new THREE.Vector2(Math.max(0.0005, rr), t * h)); }
  return new THREE.LatheGeometry(pts, 24);
}
function buildFlame(){

function makeEye(r, irisCol, lidCol){

  ball.add(mesh(SPH(r, 22, 16), M(0xf4f1ea, { roughness: .25 })));
  const iris = mesh(new THREE.CircleGeometry(r * .5, 28), Bm(irisCol), 0, 0, r * 1.002);
  const pupil = mesh(new THREE.CircleGeometry(r * .24, 22), Bm(0x050505), 0, 0, r * 1.004);
  const shine = mesh(new THREE.CircleGeometry(r * .08, 10), Bm(0xffffff), r * .16, r * .18, r * 1.006);
  ball.add(iris, pupil, shine);
  const lm = Bm(lidCol == null ? 0x0a0810 : lidCol);
  const lidT = mesh(new THREE.SphereGeometry(r * 1.05, 22, 10, 0, Math.PI * 2, 0, Math.PI / 2), lm);
  const lidB = mesh(new THREE.SphereGeometry(r * 1.05, 22, 10, 0, Math.PI * 2, 0, Math.PI / 2), lm);
  g.add(lidT, lidB);
  g.userData.eye = { ball, pupil, lidT, lidB, r, k: 1 };
  setLid(g, 0);
  return g;
}
function setLid(g, k){ const e = g.userData.eye; e.k = k; e.lidT.rotation.x = -1.3 * (1 - k); e.lidB.rotation.x = Math.PI + 1.3 * (1 - k); }

  if (!drag || drag.id !== e.pointerId || drag.fired) return;
  const dy = e.clientY - drag.y0;
  if (dy > 0 && (state === 'idle' || state === 'fire')) { wheelAng = drag.ang0 + dy * .03; if (wheelAng - drag.lastTick > .3) { drag.lastTick = wheelAng; sfx.tick(); } }
  if (dy >= swipeNeed()) { const dt = Math.max(.016, now() - drag.t0); const sp = dy / dt; drag.fired = true; strike(.7 + Math.min(.9, sp / 2200)); }
});
function endDrag(e){ if (!drag || drag.id !== e.pointerId) return; const dy = e.clientY - drag.y0; if (!drag.fired && dy > swipeNeed() * .55) strike(.8); else if (drag.fired) sfx.release(); drag = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { drag = null; });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); e.preventDefault(); return; }
  if (state === 'dex') { if (e.code === 'Escape') closeDex(); return; }
  if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'KeyR' || e.code === 'Enter') { e.preventDefault(); if (!$('fireOv').classList.contains('hide') && e.code !== 'ArrowDown' && e.code !== 'Space') return; strike(1); }
  if (e.code === 'KeyZ') openDex();
});
function startGame(){
  if (state !== 'title') return;
  if (window.rickPlay) rickPlay('ichiman-lighter');
  audioInit(); sfx.ui();
  recolorLighter(randomLighterColor());
  $('title').classList.add('hide'); document.body.classList.remove('titling'); state = 'idle'; camLookYT = 0; updateHud();
  if (REC) recStart();
}
['pointerdown', 'pointerup', 'click', 'touchend'].forEach(ev => $('title').addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); startGame(); }));
$('bMute').addEventListener('click', () => { save.muted = !save.muted; persist(); $('bMute').textContent = save.muted ? '🔇' : '🔊'; audioInit(); if (master) master.gain.value = save.muted ? 0 : .8; });
$('bMute').textContent = save.muted ? '🔇' : '🔊';
$('bDex').addEventListener('click', openDex);
$('bDexClose').addEventListener('click', closeDex);
$('tabItems').addEventListener('click', () => { dexTab = 'items'; sfx.ui(); renderDex(); });
$('tabPheno').addEventListener('click', () => { dexTab = 'pheno'; sfx.ui(); renderDex(); });
$('bShare').addEventListener('click', () => share(save.fires ? 'fire' : 'normal'));
$('bDexShare').addEventListener('click', () => share(save.fires ? 'fire' : 'normal'));
$('bFireShare').addEventListener('click', () => share('fire'));
$('bFireOk').addEventListener('click', () => { sfx.ui(); $('fireOv').classList.add('hide'); document.body.classList.remove('cine'); });
$('bAuto').addEventListener('click', () => { sfx.ui(); if (state === 'fire') return; setAuto(!autoOn); });
if (save.strikes > 0) $('titleRec').textContent = 'これまで ' + save.strikes.toLocaleString() + ' 回・図鑑 ' + gotCount() + '/' + ITEMS.length + '・現象 ' + phCount() + '/' + PH_LIST.length + (save.fires ? '・点火 ' + save.fires + ' 回' : '');

// ================= レイアウト =================
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const H = 7.6, W = 4.2; const k = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  baseDist = Math.max(H, W / camera.aspect) / k;
  if (state !== 'tease' && !burning) camDistT = baseDist;
  if (camDist < 1 || !isFinite(camDist)) camDist = baseDist;
  cracksEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
}
window.addEventListener('resize', resize); resize(); camDist = baseDist;

// ================= ループ =================
let last = performance.now();
function easeOutBack(x){ const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function frame(nowMs){
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (nowMs - last) / 1000); last = nowMs;
  let dt;
  if (hitstopT > 0) { hitstopT -= rdt; dt = 0; } else {
    if (slowT > 0) { slowT -= rdt; timeScale += (P.slowmo - timeScale) * Math.min(1, rdt * 12); }
    else timeScale += (1 - timeScale) * Math.min(1, rdt * 5);
    dt = rdt * timeScale;
  }
  T += dt;
  step(dt, rdt);
  renderer.render(scene, camera);
  if (rec) { try { recUpdate(); recDraw(); } catch (e) { console.warn(e); } }
}
function step(dt, rdt){
  const fdt = dt * freezeK;
  tickLoops();
  // 連続が途切れたか
  if (streak > 0 && state !== 'dex' && !autoOn && now() - lastStrikeAt > P.streakGap) breakStreak();
  // ライター浮遊
  teaseShake *= Math.pow(.001, rdt);
  const bob = beatBob ? Math.abs(Math.sin(T * 124 / 60 * Math.PI)) * .18 * beatBob : 0;
  lighterRoot.position.y = LBASE_Y + Math.sin(T * 1.3) * .08 + bob;
  lighterRoot.rotation.y = ROTY + Math.sin(T * .45) * .28 + (Math.random() - .5) * teaseShake;
  lighterRoot.rotation.z = Math.sin(T * .9) * .04 + (Math.random() - .5) * teaseShake * .5;
  const ls = lighterRoot.scale.x + (lighterScaleT - lighterRoot.scale.x) * Math.min(1, rdt * 4); lighterRoot.scale.setScalar(ls);
  lighterRoot.updateMatrixWorld(true);
  // ホイール
  if (!(drag && !drag.fired)) wheelAng += wheelVel * dt;
  wheelVel *= Math.pow(.03, dt);
  LU.wheel.rotation.x = wheelAng;
  leverPress = Math.max(0, leverPress - dt * 4);
  LU.lever.position.y = LU.leverY - Math.sin(Math.min(1, leverPress) * Math.PI) * .06;
  // ガスの揺れ
  sloshV += (-lighterRoot.rotation.z - slosh) * 40 * dt; sloshV *= Math.pow(.1, dt); slosh += sloshV * dt;
  LU.surf.rotation.z = slosh * .6; LU.surf.rotation.x = Math.sin(T * 1.1) * .03;
  bubbles.forEach(b => { if (b.life <= 0) return; b.life -= dt; b.m.position.y += dt * .9; if (b.life <= 0 || b.m.position.y > .24) { b.life = 0; b.m.visible = false; } });
  sparkLight.intensity *= Math.pow(.0005, rdt);

  // 溜め演出
  if (state === 'tease' && tease) {
    tease.t += dt; const k = Math.min(1, tease.t / tease.dur);
    const o = nozzleWorld(); teaseGlow.position.copy(o); teaseGlow.position.y += .25;
    let hex = tease.hex;
    if (tease.it.id === 'fire') hex = k < .55 ? RAR[2].hex : (k < .8 ? RAR[3].hex : RAR[5].hex);
    teaseGlow.material.color.setHex(hex); teaseGlow.material.opacity = .25 + k * .75; teaseGlow.scale.setScalar(.3 + k * (1.2 + Math.min(5, tease.it.r) * .35));
    teaseLight.color.setHex(hex); teaseLight.intensity = k * 3; teaseLight.position.copy(o);
    teaseShake = Math.max(teaseShake, k * (.05 + Math.min(5, tease.it.r) * .02));
    if (Math.random() < .6) sparks(2, hex, .5 + k, tease.it.r === 3 && !tease.fake);
    if (tease.t >= tease.dur) { const t0 = tease; tease = null; reveal(t0.it, t0.fake); }
  } else { teaseGlow.material.opacity *= Math.pow(.01, rdt); teaseLight.intensity *= Math.pow(.01, rdt); }

  if (state === 'fireseq') updateFireSeq(rdt);
  if (state === 'lock') { lockT -= rdt; if (lockT <= 0) state = burning ? 'fire' : 'idle'; }
  if (autoOn && state === 'idle' && now() - lastStrikeAt > P.autoInterval) strike(.85);

  // 出現アイテム
  if (current) {
    current.t += fdt; const k = Math.min(1, current.t / .45);
    current.obj.position.lerpVectors(current.from, ITEM_POS, Math.min(1, k * 1.15));
    current.obj.position.y += Math.sin(T * 1.6) * .06 * k;
    current.obj.scale.setScalar(Math.max(.01, easeOutBack(k)));
    current.obj.rotation.y = Math.sin(T * .7) * .5;
    const u = current.obj.userData.inner.userData.update; if (u) u(T);
  }
  for (let i = fly.length - 1; i >= 0; i--) {
    const f = fly[i]; f.life -= fdt; f.vy -= 9 * fdt;
    f.obj.position.x += f.vx * fdt; f.obj.position.y += f.vy * fdt; f.obj.position.z += f.vz * fdt;
    f.obj.rotation.z += f.spin * fdt; f.obj.rotation.x += f.spin * .5 * fdt;
    if (f.life <= 0) { scene.remove(f.obj); disposeObj(f.obj); fly.splice(i, 1); }
  }
  // 炎
  if (burning) {
    const fl = LU.flame; fl.userData.parts.forEach((p, i) => p.scale.set(1 + Math.sin(T * 17 + i) * .06 + (Math.random() - .5) * .05, 1 + Math.sin(T * 13 + i * 2) * .1 + (Math.random() - .5) * .08, 1));
    const o = nozzleWorld(); fireLight.position.set(o.x, o.y + .4, o.z + .3); fireLight.intensity = 2.6 + Math.sin(T * 23) * .4 + Math.random() * .4;
    if (!activePh.some(a => a.d.id === 'blackout')) hemi.intensity += (.4 - hemi.intensity) * Math.min(1, rdt * 3);
    if (Math.random() < .9) spawnSprite({ x: o.x + (Math.random() - .5) * .08, y: o.y + .3, z: o.z, vx: (Math.random() - .5) * .25, vy: 1.4 + Math.random() * .8, s0: .32, s1: .05, op: .5, life: .45 + Math.random() * .25, col: 0xffc048, col2: 0xff3010, add: true });
    if (Math.random() < .15) emit({ x: o.x, y: o.y + .6, z: o.z, vx: (Math.random() - .5) * .6, vy: 1 + Math.random() * 1.5, vz: (Math.random() - .5) * .4, grav: -.5, drag: .5, life: 1, max: 1, r: 1, g: .55, b: .15 });
    sfx.roarFlutter();
  } else { fireLight.intensity *= Math.pow(.01, rdt); if (!activePh.some(a => a.d.id === 'blackout')) hemi.intensity += (BASE_LIGHT.hemi - hemi.intensity) * Math.min(1, rdt * 3); }
  if (confettiT > 0) { confettiT -= rdt; for (const sx of [-1, 1]) { const c = colOf(0, true); emit({ x: sx * Math.random() * 3, y: 4, z: (Math.random() - .5) * 2, vx: (Math.random() - .5) * .8, vy: -1, vz: 0, grav: 1.2, drag: .6, life: 3, max: 3, r: c[0], g: c[1], b: c[2] }); } }

  phUpdate(dt, rdt);
  updateParts(fdt); updateSprites(fdt);

  // カメラ
  camDist += (camDistT - camDist) * Math.min(1, rdt * 4);
  camLookY += (camLookYT - camLookY) * Math.min(1, rdt * 4);
  camRoll += (camRollT - camRoll) * Math.min(1, rdt * 2.5);
  shakeA *= Math.pow(.004, rdt);
  const sx = (Math.random() - .5) * shakeA, sy = (Math.random() - .5) * shakeA;
  camera.position.set(Math.sin(camYaw) * camDist + sx, .35 + sy, Math.cos(camYaw) * camDist);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, camLookY - .45, 0);
  if (camRoll) camera.rotateZ(camRoll);
  if (state === 'idle' && !current && camDistT !== baseDist) { camDistT = baseDist; camLookYT = 0; }
}

// ================= デバッグ =================
let dbgOn = false;
function initDebug(){
  if (dbgOn) return; dbgOn = true;
  const d = $('dbg'); d.classList.remove('hide');
  const sl = (key, min, max, stepv) => { const id = 'd_' + key; return '<label>' + key + ' <b id="' + id + 'v">' + P[key] + '</b><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + stepv + '" value="' + P[key] + '"></label>'; };
  d.innerHTML = '<div class="tg" id="dTg">DEBUG ▾</div>' + sl('shake', 0, 3, .05) + sl('hitstop', 0, .2, .005) + sl('swipe', 10, 160, 1) + sl('fireWeight', 1, 5000, 1) + sl('slowmo', .05, 1, .05) + sl('autoInterval', .1, 1.5, .02) + sl('autoUnlock', 0, 1000, 10) + sl('streakGap', 1, 20, .5) + sl('phenoRate', .2, 5, .1) + sl('kaiChance', 0, 1, .01) + sl('fsFake', 0, 1, .05) + sl('fsPuchun', 0, 1, .05) + sl('fsSoma', 0, 1, .05) + sl('fsSilence', .5, 4, .1) +
    '<div class="row">' + RAR.map((r, i) => '<button data-r="' + i + '">' + r.k + '</button>').join('') + '</div>' +
    '<div class="row"><button id="dGase">ガセ</button><button id="dPlus">+1000回</button><button id="dSt">連続+30</button><button id="dAll">全解放</button><button id="dReset">リセット</button><button id="dLog">値をコピー</button></div>' +
    '<div class="row">' + PH_LIST.map(p => '<button data-p="' + p.id + '">' + p.name + '</button>').join('') + '</div>';
  $('dTg').addEventListener('click', () => d.classList.toggle('min'));
  Object.keys(P).forEach(k => { const el = $('d_' + k); if (!el) return; el.addEventListener('input', () => { P[k] = parseFloat(el.value); $('d_' + k + 'v').textContent = P[k]; computeWeights(); updateHud(); }); });
  d.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { const r = +b.dataset.r; forceNext = rpick(ITEMS.filter(it => it.r === r)); }));
  d.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { audioInit(); phStart(b.dataset.p); }));
  $('dGase').addEventListener('click', () => { forceNext = ITEMS[0]; const o = rnd01; let once = true; rnd01 = () => { if (once) { once = false; return 0; } return o(); }; });
  $('dPlus').addEventListener('click', () => { save.strikes += 1000; persist(); updateHud(); });
  $('dSt').addEventListener('click', () => { streak += 30; lastStrikeAt = now(); updateHud(); });
  $('dAll').addEventListener('click', () => { ITEMS.forEach(it => { if (!save.got[it.id]) save.got[it.id] = { n: 1, first: save.strikes }; }); PH_LIST.forEach(p => { if (!save.pheno[p.id]) save.pheno[p.id] = 1; }); persist(); updateHud(); });
  $('dReset').addEventListener('click', () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); });
  $('dLog').addEventListener('click', () => { const s = JSON.stringify(P); try { navigator.clipboard.writeText(s); } catch (e) {} console.log(s); });
}
if (DEBUG) initDebug();
window.addEventListener('hashchange', () => { if (location.hash === '#debug') initDebug(); });
let keyBuf = '';
window.addEventListener('keydown', e => { if (e.key && e.key.length === 1) { keyBuf = (keyBuf + e.key.toLowerCase()).slice(-5); if (keyBuf === 'debug') initDebug(); } });

// テスト用フック
window.__lighter = { P, ITEMS, PH_LIST, roll: () => rollItem(), save: () => save, strike, get state(){ return state; }, get streak(){ return streak; }, set streak(v){ streak = v; lastStrikeAt = now(); }, force: id => { forceNext = ITEM_BY[id]; }, pheno: id => phStart(id), active: () => activePh.map(a => a.d.id), openDex, closeDex, startGame, thumb: id => thumb(ITEM_BY[id]), prep: id => prep(ITEM_BY[id]) };

scheduleFirst();
updateHud();
requestAnimationFrame(frame);
})();
