<script>
'use strict';
/* ============================================================
   ピクトさん、踊りだす  (rickther1ck.com/pict-dance/)
   人が見ていない間に連打で踊らせ、人が来たら止まる。
   ============================================================ */
const SLUG = 'pict-dance';
const URL_GAME = 'https://rickther1ck.com/pict-dance/';
const Q = new URLSearchParams(location.search);
const DEBUG = Q.get('debug') === '1';
const REC = Q.get('rec') === '1';
const DEMO = /demo/.test(location.hash) || REC;
const $ = id => document.getElementById(id);

// ---- 調整パラメータ（?debug=1 でいじれる） ----
const CFG = {
  tapEnergy: .45,     // 1回の連打でたまる踊りエネルギー
  decay: 2.0,        // 手を止めたときに静まる速さ
  tapsPerDance: 10,  // 何回の連打で踊りが1つ決まるか
  susRate: 2.6,      // 見られているときに怪しまれる速さ
  spawnMul: 1,       // 通行人の来る間隔（大きいほどゆっくり）
  shake: 1,          // 画面揺れ
  hitstop: .05,      // 踊りが決まったときのヒットストップ（秒）
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(SLUG + '_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(SLUG + '_' + k, JSON.stringify(v)); } catch (e) {} }
};

if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div id="nogl">読み込みに失敗しました。通信状態を確認して、ページを再読み込みしてください。</div>'); throw new Error('three.js not loaded'); }

// ============================================================
//  ポーズ（ピクトさんの関節）
//  腕・脚：0=真下、+で画面右、±π/2=水平、±π=真上
// ============================================================
const KEYS = ['tl', 'hd', 'la', 'le', 'ra', 're', 'll', 'lk', 'rl', 'rk', 'hy', 'hx', 'rz', 'ry', 'oz', 'sw', 'sc'];
const P = o => Object.assign({ tl: 0, hd: 0, la: -.12, le: 0, ra: .12, re: 0, ll: -.07, lk: 0, rl: .07, rk: 0, hy: 0, hx: 0, rz: 0, ry: 0, oz: 0, sw: .06, sc: 0 }, o);
const mirror = p => ({ tl: -p.tl, hd: -p.hd, la: -p.ra, le: -p.re, ra: -p.la, re: -p.le, ll: -p.rl, lk: -p.rk, rl: -p.ll, rk: -p.lk, hy: p.hy, hx: -(p.hx || 0), rz: -(p.rz || 0), ry: -(p.ry || 0), oz: p.oz || 0, sw: p.sw ?? .06, sc: p.sc || 0 });
const POSE = {
  stand: P({}),
  walk: P({ tl: .08, hd: .05, la: .5, le: .35, ra: -.55, re: .25, ll: .4, lk: -.05, rl: -.38, rk: .3 }),       // 横断歩道の人（右へ歩く）
  walkKid: P({ tl: .05, la: .7, le: .2, ra: -.6, re: .4, ll: .42, lk: -.05, rl: -.35, rk: .35 }),
  // ---- 標識どおりのポーズ（参考マークに合わせる） ----
  signWalk: P({ tl: .1, hd: .05, sw: .0, la: -.28, le: .1, ra: .38, re: .6, ll: -.48, lk: .32, rl: .46, rk: -.08, hy: .02 }),
  signBoy: P({ tl: .08, sw: .0, la: -.35, le: .2, ra: 1.0, re: .2, ll: -.45, lk: .3, rl: .45, rk: -.1, hy: .02 }),
  signGirl: P({ tl: .04, sw: .0, la: -.95, le: -.1, ra: .4, re: .6, ll: -.35, lk: .25, rl: .38, rk: -.05, hy: .02 }),
  signAdultFront: P({ la: -.1, ra: .32, ll: -.03, rl: .03 }),
  signChildFront: P({ la: -.55, ra: .12, ll: -.05, rl: .05 }),
