 // text

async function doShare(){const cv=makeImage();const text=shareText();
 const inapp=document.body.classList.contains('inapp');
 if(!inapp&&navigator.share&&navigator.canShare){try{const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],'chokokuto-chikyu.png',{type:'image/png'});

// ===== recommendations =====
const RECS=[{"slug": "ichiman-lighter", "title": "1万分の1ライター"}, {"slug": "warabimochi", "title": "わらび餅職人", "thumb": "og.jpg"}, {"slug": "yakitori-dart", "title": "爆速焼き鳥ダーツ"}, {"slug": "mosamosa-trimming", "title": "モサモサわんこトリミング", "thumb": "og.jpg"}, {"slug": "pict-dance", "title": "ピクトさん、踊りだす"}, {"slug": "yakisoba", "title": "ジュワッと！屋台焼きそば", "thumb": "og.png?v=2"}];

 pool.forEach(g=>{const a=document.createElement('a');a.className='rec';a.href=`https://rickther1ck.com/${g.slug}/`;a.innerHTML=`<img loading="lazy" src="https://rickther1ck.com/${g.slug}/${g.thumb||'og.png'}" alt=""><div>${g.title}</div>`;a.addEventListener('pointerdown',e=>e.stopPropagation());box.appendChild(a);});
 if(!pool.length)box.parentNode.querySelector('.mt').classList.add('hide');}
renderRecs();

// ===== input =====
const ptrs=new Map();let ang0=0,mode=null,downT=0,downX=0,downY=0,pinch0=0,zoom0=1,mid0=null,hover=null;
canvas.addEventListener('pointerdown',e=>{
 audio();if(AC&&AC.state==='suspended')AC.resume();
 canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});downT=performance.now();downX=e.clientX;downY=e.clientY;
 if(state==='title'){if(e.button===2)return;const sb=$('slowBtn').getBoundingClientRect();const inS=e.clientX>=sb.left-8&&e.clientX<=sb.right+8&&e.clientY>=sb.top-8&&e.clientY<=sb.bottom+8;startGame(inS?'doodle':'normal');mode='none';return;}
 if(state==='ending'){skipEnding();mode='none';return;}
 if(ptrs.size===2){endStroke();const a=[...ptrs.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);ang0=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);zoom0=zoom;mid0={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};mode='pinch';return;}
 if(ptrs.size>2)return;
 if(state==='play'&&e.button!==2){const h=pick(e.clientX,e.clientY);if(h){mode='carve';stroke.active=true;stroke.prev=null;sid+=3;G.strokes++;beginUndo();
   if(!G.started){G.started=true;$('hint').classList.add('hide');}carveTo(h.local,true);return;}}
 mode='rot';});
canvas.addEventListener('pointermove',e=>{
 const p=ptrs.get(e.pointerId);
 if(!p){ if(state==='play'&&e.pointerType==='mouse'){hover=pick(e.clientX,e.clientY);} return;}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(mode==='pinch'&&ptrs.size>=2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom=Math.min(1.3,Math.max(0.42,zoom0*pinch0/Math.max(1,d)));const m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};rotateBy(m.x-mid0.x,m.y-mid0.y);mid0=m;
  const an=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);let da=an-ang0;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;ang0=an;if(Math.abs(da)<0.5)earth.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-da));return;}
 if(mode==='rot'){rotateBy(dx,dy);return;}
 if(mode==='carve'&&state==='play'){const h=pick(e.clientX,e.clientY);if(h)carveTo(h.local,true);else stroke.prev=null;}});
function endStroke(){endUndo();stroke.active=false;stroke.prev=null;if(mode==='carve')mode=null;}
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!had)return;
 if(state==='result'&&mode==='rot'&&performance.now()-downT<300&&Math.hypot(e.clientX-downX,e.clientY-downY)<10){const h=pick(e.clientX,e.clientY);if(h){startGame();}}
 if(ptrs.size===0){endStroke();mode=null;}else if(mode==='pinch'&&ptrs.size===1)mode='rot';}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hover=null;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.3,Math.max(0.42,zoom*Math.exp(e.deltaY*0.0012)));},{passive:false});
addEventListener('keydown',e=>{audio();if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')&&state==='play'&&G.mode==='doodle'){e.preventDefault();doUndo();return;}if((e.key==='d'||e.key==='D')&&state==='title'){startGame('doodle');return;}if(e.key==='1'||e.key==='2'||e.key==='3')setTool(+e.key-1);
 if((e.key==='r'||e.key==='R'||e.key===' ')&&(state==='result'||state==='title')){e.preventDefault();startGame(state==='title'?'normal':G.mode);}
 if(e.key===' '&&state==='ending'){e.preventDefault();skipEnding();}});
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();audio();setTool(+b.dataset.t);tone(900,900,0.04,0.1,'square');}));
$('mute').addEventListener('click',e=>{e.stopPropagation();audio();muted=!muted;LS.set('mute',muted);updMute();});
$('retry').addEventListener('click',e=>{e.stopPropagation();audio();startGame();});
$('share').addEventListener('click',e=>{e.stopPropagation();doShare();});
$('save').addEventListener('click',e=>{e.stopPropagation();showImage();});
$('mClose').addEventListener('click',()=>$('imgModal').classList.add('hide'));
$('slowBtn').addEventListener('pointerdown',e=>{e.stopPropagation();audio();if(state==='title')startGame('doodle');});
$('modeSw').addEventListener('click',e=>{e.stopPropagation();audio();if(state==='result')startGame(G.mode==='doodle'?'normal':'doodle');});

$('dUndo').addEventListener('click',e=>{e.stopPropagation();audio();if(state==='play'&&!stroke.active)doUndo();});
$('dDone').addEventListener('click',e=>{e.stopPropagation();audio();if(state==='play')endGame();});
$('dReset').addEventListener('click',e=>{e.stopPropagation();audio();if(state==='play'){resetEarth();newGameStats('doodle');G.started=true;}});

// ===== debug =====
if(DEBUG){const d=$('debug');d.classList.remove('hide');const R={time:[10,90,1],depth:[0.01,0.15,0.005],width:[0.5,2.5,0.05],hMantle:[0.1,2,0.02],hOuter:[0.1,2,0.02],hInner:[0.05,2,0.01],shake:[0,3,0.1],hitstop:[0,0.3,0.01],chips:[0,3,0.1]};
 for(const k in R){const l=document.createElement('label');const s=document.createElement('input');s.type='range';s.min=R[k][0];s.max=R[k][1];s.step=R[k][2];s.value=T[k];const sp=document.createElement('span');sp.textContent=` ${k}: ${T[k]}`;
  s.oninput=()=>{T[k]=+s.value;sp.textContent=` ${k}: ${T[k]}`;};l.appendChild(sp);l.appendChild(s);d.appendChild(l);}
 const fps=document.createElement('div');d.appendChild(fps);setInterval(()=>{fps.textContent='fps '+frames;frames=0;},1000);}

// ===== loop =====
let last=performance.now();
function loop(now){requestAnimationFrame(loop);frames++;
 const rdt=Math.min(location.hash==='#test'?3:0.25,(now-last)/1000),dt=Math.min(0.05,rdt);last=now;let sdt=dt;if(hitstop>0){hitstop-=dt;sdt=0;}
 if(state==='title'){demoT+=dt;earth.quaternion.premultiply(_q.setFromAxisAngle(_Y,dt*0.12));
  const a=demoT*1.25,wd=new THREE.Vector3(Math.sin(a)*0.42,0.18+Math.sin(a*2.1)*0.16,1).normalize();
  _qi.copy(earth.quaternion).invert();const ld=wd.applyQuaternion(_qi);carveTo(ld,false);
  if(demoT>14){resetEarth();stroke.prev=null;demoT=0;}}
 if(state==='play'){
  updPop();
  if(G.finishAt&&performance.now()>=G.finishAt){G.finishAt=0;endGame();}
  if(G.mode==='normal'&&G.started&&!G.centerTime&&hitstop<=0){G.time-=rdt;const t=Math.max(0,G.time);$('tnum').textContent=t.toFixed(1);if(t<=5){$('timer').classList.add('warn');const s=Math.ceil(t);if(s<lastTick&&s>0){lastTick=s;tickSnd(s<=3);}}
   if(G.time<=0){$('tnum').textContent='0.0';endGame();}}
  if(!stroke.active){if(hover){const r=nearestR(hover.local.x,hover.local.y,hover.local.z);_wn.copy(hover.local).applyQuaternion(earth.quaternion);chiselState.on=true;chiselState.n.copy(_wn);chiselState.p.copy(_wn).multiplyScalar(r+0.03);chiselState.press=0;}else chiselState.on=false;}
 }
 if(state==='ending')updEnding(rdt);
 if(state==='result'){glowU.value=1.6+0.25*Math.sin(now/300);}
 chiselState.press*=Math.pow(0.02,dt);
 placeChisel(dt);
 updateScrape(rdt);
 updateChips(sdt);
 flush();
 moon.position.set(Math.cos(now/40000)*5.5,1.8+Math.sin(now/40000)*0.6,-6+Math.sin(now/40000)*2);moon.rotation.y=now/50000;
 updateCamera(dt);
 if(shake>0.0002){const sk=shake*(state==='play'&&G.mode==='doodle'?0.08:1);camera.position.x+=(Math.random()-0.5)*sk*2;camera.position.y+=(Math.random()-0.5)*sk*2;shake*=Math.pow(0.004,dt);}
 if(flashV>0.001){$('flash').style.opacity=flashV;flashV*=Math.pow(0.002,dt);}else $('flash').style.opacity=0;
 if(carveDirty&&(frames&1)){carveTex.needsUpdate=true;carveDirty=false;}
 renderer.render(scene,camera);FULL=false;
}

if(location.hash==='#test'||location.hash==='#size'){const d=document.createElement('div');d.style.cssText='position:fixed;left:4px;bottom:4px;z-index:99;font:12px monospace;color:#0f0;background:#000a;padding:2px 4px;pointer-events:none';document.body.appendChild(d);setInterval(()=>{d.textContent=innerWidth+'x'+innerHeight+' dpr'+devicePixelRatio+' vv'+(window.visualViewport?Math.round(visualViewport.width)+'x'+Math.round(visualViewport.height):'-');},500);}
requestAnimationFrame(()=>setTimeout(()=>{
 try{buildEarth();initCarve();}catch(e){$('loading').textContent='読み込みに失敗しました: '+e.message;throw e;}
 $('loading').classList.add('hide');setTool(0);showTitle();requestAnimationFrame(loop);

},30));
