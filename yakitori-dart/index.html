<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="串は1本、チャンスは1回。焼き鳥を刺しまくりながら宇宙まで飛んで、惑星まで串に刺す3Dブラウザゲーム。">
<meta property="og:title" content="爆速焼き鳥ダーツ">
<meta property="og:description" content="串は1本、チャンスは1回。焼き鳥を刺しまくりながら宇宙まで飛んで、惑星まで串に刺す。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rickther1ck.com/yakitori-dart/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#120c22">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>爆速焼き鳥ダーツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Boku&family=Zen+Old+Mincho:wght@400;700;900&display=swap">
<style>
/* Layout: a yakitori stall at night. Score on a hanging wooden tag, live readings on a paper menu card, the heat gauge as a bamboo tube, title under a noren curtain, results as a handwritten bill. Single dark look by design. */
:root{
  --night:#120c22;
  --ink:#f6ead4;
  --dim:#b8a99a;
  --sumi:#1d130d;
  --shu:#c8361f;
  --ai:#1d2847;
  --paper:#f3e8cf;
  --wood:#b4824a;
  --ember:#ffb347;
  --hot:#fff2b8;
  --font-brush:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-num:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-body:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#c{display:block;width:100%;height:100%;cursor:crosshair}

/* materials */
.wood{color:#2a160a;background:
  repeating-linear-gradient(91deg,rgba(70,35,12,0) 0 9px,rgba(70,35,12,.16) 9px 10px,rgba(255,230,190,.07) 10px 19px,rgba(70,35,12,.1) 19px 20px),
  radial-gradient(ellipse 60% 30% at 30% 40%,rgba(90,45,15,.25),transparent 70%),
  linear-gradient(180deg,#cfa06a,#a9763f);
  border:3px solid #3a2214;box-shadow:inset 0 0 0 2px rgba(255,232,195,.28),inset 0 -8px 14px rgba(50,22,6,.35),0 10px 24px #000a}
.paper{color:var(--sumi);background:
  repeating-linear-gradient(0deg,rgba(120,90,50,.05) 0 2px,transparent 2px 5px),
  radial-gradient(ellipse at 80% 10%,rgba(150,110,60,.12),transparent 60%),
  linear-gradient(#f6edd6,#eadcbb)}
.brush{font-family:var(--font-brush);font-weight:400}

/* score tag hanging from a nail */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.tag{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 18px 10px;border-radius:6px 6px 10px 10px;min-width:150px;transform:rotate(-1.5deg)}
.tag::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:#d8c6a0;transform:translateX(-50%)}
.tag::after{content:"";position:absolute;top:6px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#2a160a;box-shadow:inset 0 1px 1px #000}
.tag-lbl{font-family:var(--font-brush);font-size:15px;margin-top:8px;letter-spacing:.08em}
.tag-num{font-family:var(--font-num);font-size:clamp(46px,8vw,72px);line-height:1;font-variant-numeric:tabular-nums;color:#2a1306;text-shadow:0 1px 0 rgba(255,235,200,.55),0 -1px 0 rgba(40,15,4,.4)}
.tag-best{font-family:var(--font-body);font-weight:900;font-size:12px;margin-top:4px;padding:1px 10px;border-top:1px solid rgba(42,22,10,.35);font-variant-numeric:tabular-nums}
.tag.record{animation:tagRecord 1.2s ease-out}
.tag.record .tag-best{color:#8e1f10}
.tag.beat{box-shadow:inset 0 0 0 2px rgba(255,232,195,.28),0 0 0 3px #ffd84a,0 0 28px #ffb347,0 10px 24px #000a}
@keyframes tagRecord{0%{transform:rotate(-1.5deg) scale(1)}12%{transform:rotate(4deg) scale(1.25)}30%{transform:rotate(-4deg) scale(1.1)}55%{transform:rotate(2deg) scale(1.05)}100%{transform:rotate(-1.5deg) scale(1)}}
.record-line{margin:6px 0 2px;padding:6px 10px;background:rgba(200,54,31,.1);border:1.5px dashed var(--shu);font-family:var(--font-brush);font-size:16px;color:var(--shu);text-align:center;font-variant-numeric:tabular-nums}
.record-line b{font-family:var(--font-num);font-weight:400;font-size:20px}
.stamp.new.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:rotate(-40deg) scale(3.2);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1)}}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.tag-num small{font-family:var(--font-brush);font-size:.34em;margin-left:4px}

/* paper menu card with the live readings */
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}
.menu-card{min-width:178px;padding:10px 14px 10px;border-top:5px solid var(--shu);border-radius:2px;box-shadow:0 8px 22px #0009;transform:rotate(1deg)}
.mc-title{font-family:var(--font-brush);font-size:13px;text-align:center;letter-spacing:.3em;padding-bottom:6px;border-bottom:1px solid rgba(29,19,13,.25);margin-bottom:4px}
.mc-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:4px 0;border-bottom:1px dotted rgba(29,19,13,.3)}
.mc-row:last-child{border-bottom:none}
.mc-row span{font-family:var(--font-brush);font-size:16px}
.mc-row b{font-family:var(--font-num);font-weight:400;font-size:clamp(18px,3vw,24px);font-variant-numeric:tabular-nums}
.mc-row b small{font-family:var(--font-body);font-weight:900;font-size:.5em;margin-left:2px}
.mc-row b.fast{color:var(--shu)}
.mc-row b.zone{font-family:var(--font-brush);font-size:18px;color:var(--shu)}
.sound-btns{display:flex;gap:6px}
.mute{font:400 13px var(--font-brush);padding:5px 12px;border-radius:4px;cursor:pointer;border-width:2px}
.mute:focus-visible,.btn:focus-visible,.panel-toggle:focus-visible,.peek:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

/* bamboo heat gauge */
.gauge-wrap{position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-36%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hanko{font-family:var(--font-brush);font-size:17px;color:#fff3e4;background:var(--shu);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff3e455;box-shadow:0 0 18px #ff6a2f99;transform:rotate(-8deg)}
.gauge{position:relative;width:42px;height:min(48vh,340px);border-radius:10px;padding:5px;
  background:repeating-linear-gradient(180deg,transparent 0 calc(25% - 4px),#4f5a22 calc(25% - 4px) calc(25% - 1px),#e2dc96 calc(25% - 1px) 25%),
  linear-gradient(90deg,#6c7a2c,#b9bb62 35%,#d6d38a 50%,#8d9640 80%,#5d6a24);
  box-shadow:0 0 0 2px #2c3210,0 10px 24px #000a}
.gauge-in{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 10px #000c;
  background:linear-gradient(to top,#1a0604 0%,#5a120a 22%,#b8260f 48%,#ff6a1a 72%,#ffb347 86%,#fff3c6 100%)}
.god-zone{position:absolute;left:0;right:0;top:0;height:5%;background:linear-gradient(#fff,#ffe27a);box-shadow:0 0 10px #fff}
#whiteflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#slow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(10,4,20,.75) 100%);
  box-shadow:inset 0 0 0 6px rgba(255,226,122,.55)}
.perfect-zone{position:absolute;left:0;right:0;top:0;height:10%;background:repeating-linear-gradient(-45deg,#ffffff66 0 5px,transparent 5px 10px);border-bottom:2px solid #fff}
.marker{position:absolute;left:-16px;right:-10px;height:6px;margin-top:-3px;background:linear-gradient(#f0d9a6,#c49a5a);border-radius:0 3px 3px 0;box-shadow:0 0 0 1.5px #3a2214,0 0 10px #fff8}
.marker::before{content:"";position:absolute;left:-9px;top:-1px;border:4px solid transparent;border-right:9px solid #e6c88e;border-left:0}
.zone-lbl{font-family:var(--font-brush);font-size:20px;min-width:3em;text-align:center;padding:2px 10px;border-radius:4px}
.zone-lbl.hot{background:var(--shu);color:#fff3e4;border-color:#4a140a}
.gauge-name{font-family:var(--font-brush);font-size:13px;color:var(--ink);text-shadow:0 2px 4px #000}

/* paper strip guide */
.guide{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-.6deg);width:max-content;max-width:calc(100% - 32px);text-align:center;
  font-family:var(--font-brush);font-size:17px;padding:9px 20px;border-left:5px solid var(--shu);box-shadow:0 8px 20px #0009;pointer-events:none}
.guide b{color:var(--shu);font-weight:400}

#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-brush);white-space:nowrap;animation:rise .8s ease-out forwards;
  text-shadow:0 0 2px #2a0d04,0 0 2px #2a0d04,0 3px 0 #5a1a08,0 0 14px #000a}
.pop.hit{font-size:26px;color:var(--hot)}
.pop.mile{font-size:54px;color:#fff6e6;text-shadow:0 0 3px var(--shu),0 0 3px var(--shu),0 5px 0 #5a1a08,0 0 28px #ff6a2f;animation-duration:1.3s}
.pop.gold{font-size:32px;color:#ffd84a}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#fff7d6,#ffb34700 70%);opacity:0;pointer-events:none}
#lines{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff0 0deg 4deg,#ffffff18 4deg 5deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 75%);mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 75%)}
#center{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--font-brush);font-size:clamp(56px,13vw,130px);color:#fff6e6;
  text-shadow:0 0 3px #3a0d04,0 0 3px #3a0d04,0 6px 0 var(--shu),0 0 34px #ff6a2f99;pointer-events:none;white-space:nowrap}
#center.bang{animation:bang .5s ease-out}
@keyframes bang{0%{transform:translate(-50%,-50%) scale(1.6) rotate(-6deg);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}}

/* overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#titleScreen{background:radial-gradient(ellipse at 50% 70%,#120c2240,#0a0614c4);padding-top:calc(min(16vh,120px) + 10px)}
.noren{position:absolute;left:0;right:0;top:0;height:min(16vh,120px);display:flex;justify-content:center;gap:4px;padding:0 6vw;pointer-events:none}
.noren::before{content:"";position:absolute;left:3vw;right:3vw;top:0;height:10px;background:linear-gradient(#6b4a2c,#3a2214);border-radius:0 0 4px 4px;z-index:1;box-shadow:0 3px 6px #0008}
.noren span{flex:1;max-width:140px;position:relative;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px),linear-gradient(#25325a,var(--ai));
  border-radius:0 0 3px 3px;display:grid;place-items:center;transform-origin:top center;animation:sway 5s ease-in-out infinite;box-shadow:0 8px 16px #0007}
.noren span:nth-child(2){animation-delay:-1.3s}.noren span:nth-child(3){animation-delay:-2.6s}.noren span:nth-child(4){animation-delay:-3.9s}
.noren i{font-style:normal;font-family:var(--font-brush);font-size:clamp(28px,4.5vw,44px);color:#f4ecdc;width:1.6em;height:1.6em;display:grid;place-items:center;border-radius:50%;border:3px solid #f4ecdc33;margin-top:8px}
@keyframes sway{0%,100%{transform:rotate(.8deg)}50%{transform:rotate(-.8deg)}}
.title-col{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(440px,100%)}
.signboard{width:100%;padding:20px 22px 16px;border-radius:6px;text-align:center}
.kicker{font-family:var(--font-brush);font-size:15px;color:#4a240e;letter-spacing:.2em}
h1{font-family:var(--font-num);font-weight:400;font-size:clamp(34px,8vw,50px);letter-spacing:.02em;line-height:1.15;margin:6px 0 0;text-wrap:balance;color:#24110a;text-shadow:0 1px 0 rgba(255,235,200,.5),0 -1px 0 rgba(40,15,4,.35)}
h1 em{font-style:normal;color:#8e1f10}
.menu{width:100%;padding:8px 20px;border-top:6px solid var(--shu);box-shadow:0 10px 28px #000a}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dotted rgba(29,19,13,.3)}
.steps li:last-child{border-bottom:none}
.steps .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--shu);color:#fff6e6;font-family:var(--font-num);font-size:20px;box-shadow:inset 0 -2px 0 #7a1e0f}
.steps div{display:flex;flex-direction:column;gap:3px;min-width:0}
.steps b{font-family:var(--font-body);font-weight:900;font-size:18px;line-height:1.3}
.steps small{font-family:var(--font-body);font-weight:700;font-size:13px;opacity:.7}
.btn{font-family:var(--font-brush);font-size:24px;color:#fff6e6;background:linear-gradient(#dc4b2e,#a52d19);border:2px solid #4a140a;border-radius:4px;padding:10px 34px;cursor:pointer;
  box-shadow:inset 0 1px 0 #ff9a7a,inset 0 -3px 0 #7a1e0f,0 6px 18px #c8361f66;text-shadow:0 2px 0 #5a1608}
.btn:active{transform:translateY(2px)}
.btn.ghost{font-size:16px;color:var(--sumi);background:transparent;border:1.5px solid rgba(29,19,13,.6);box-shadow:none;text-shadow:none;padding:9px 16px}
.best{font-family:var(--font-brush);font-size:15px;color:var(--ink);text-shadow:0 2px 4px #000}

/* result: a handwritten bill at the side so the finished skewer stays in view */
#resultScreen{background:linear-gradient(to right,#0a0614cc 0,#0a061488 28%,#0a061400 52%);place-items:center start;pointer-events:none;padding-left:max(28px,env(safe-area-inset-left,0px))}
.slip{position:relative;pointer-events:auto;width:min(360px,100%);padding:20px 22px 30px;transform:rotate(-1deg);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--shu);padding-bottom:6px}
.slip-title{font-family:var(--font-brush);font-size:28px;color:var(--shu);letter-spacing:.2em}
.slip-shop{font-family:var(--font-brush);font-size:15px}
.slip-no{font-size:11px;font-weight:700;opacity:.6;margin-top:4px;letter-spacing:.1em}
.slip-total{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 4px}
.slip-total>span{font-family:var(--font-brush);font-size:18px}
.slip-total b{font-family:var(--font-num);font-weight:400;font-size:clamp(50px,9vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.slip-total small{font-family:var(--font-brush);font-size:.3em;margin-left:4px}
.items{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;border-top:1px solid rgba(29,19,13,.3);border-bottom:1px solid rgba(29,19,13,.3);padding:6px 0;margin:8px 0}
.items div{display:flex;justify-content:space-between;font-family:var(--font-brush);font-size:16px;padding:2px 0}
.items div b{font-family:var(--font-body);font-weight:900;font-variant-numeric:tabular-nums}
.items div.zero{opacity:.35}
.items div.planet-row{color:var(--shu)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 14px;font-size:13px;font-weight:700}
.meta dt{font-family:var(--font-brush);font-size:15px;font-weight:400}
.meta dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stamp{position:absolute;top:56px;right:18px;font-family:var(--font-brush);font-size:17px;color:var(--shu);border:3px solid var(--shu);border-radius:6px;padding:6px 8px;
  writing-mode:vertical-rl;letter-spacing:.1em;transform:rotate(9deg);opacity:.88;mix-blend-mode:multiply;box-shadow:inset 0 0 0 2px #f6edd6,inset 0 0 0 3px var(--shu)}
.stamp.new{top:auto;bottom:118px;right:auto;left:16px;writing-mode:horizontal-tb;font-size:14px;border-radius:50%;width:58px;height:58px;padding:0;display:grid;place-items:center;transform:rotate(-14deg)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.actions .btn{font-size:20px;padding:9px 18px}
.copied{min-height:1.2em;font-size:12px;font-weight:700;color:var(--shu);margin-top:6px;text-align:center}
.panel-toggle{display:block;margin:6px auto 0;font:400 15px var(--font-brush);color:var(--sumi);background:none;border:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.peek{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:auto;font-family:var(--font-brush);font-size:18px;padding:8px 18px;border-radius:5px;cursor:pointer}
.drag-hint{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font-family:var(--font-brush);font-size:14px;padding:7px 14px;box-shadow:0 6px 16px #0008;pointer-events:none}
@media (max-width:640px){
  #resultScreen{background:linear-gradient(to top,#0a0614e0 0,#0a061488 40%,#0a061400 62%);place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .slip{padding:14px 16px 26px;transform:none}
  .slip-total b{font-size:46px}
  .items{grid-template-columns:repeat(3,1fr);column-gap:10px}
  .items div{font-size:14px}
  .meta{grid-template-columns:auto 1fr auto 1fr;font-size:12px;margin-bottom:10px}
  .stamp{top:48px;font-size:14px}
  .stamp.new{bottom:auto;top:12px;left:auto;right:96px;width:48px;height:48px;font-size:12px}
  .drag-hint{top:calc(150px + env(safe-area-inset-top,0px));bottom:auto;right:50%;transform:translateX(50%)}
}
@media (max-width:520px){.gauge{width:34px;height:min(40vh,280px)}.steps b{font-size:16px}.guide{font-size:15px}.menu-card{min-width:140px}.tag{min-width:120px}}

/* ===== phone layout: compact HUD up top, gauge low on the right, results as a short bottom sheet so the skewer stays in view ===== */
@media (max-width:640px){
  .hud{padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));gap:8px}
  .tag{min-width:0;padding:6px 12px 5px;border-width:2px;transform:rotate(-1deg)}
  .tag::before,.tag::after{display:none}
  .tag-lbl{font-size:11px;margin-top:0;letter-spacing:.04em}
  .tag-num{font-size:38px}
  .tag-best{font-size:11px;margin-top:2px;padding:1px 6px}
  .right{gap:6px}
  .menu-card{min-width:0;width:150px;padding:4px 10px 4px;border-top-width:3px;transform:none}
  .mc-title{display:none}
  .mc-row{padding:2px 0;gap:8px}
  .mc-row span{font-size:12px}
  .mc-row b{font-size:15px}
  .mc-row b.zone{font-size:14px}
  .mute{font-size:11px;padding:3px 8px;border-width:1.5px}
  .gauge-wrap{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;gap:6px}
  .gauge{width:30px;height:min(30vh,220px);padding:4px}
  .hanko{width:38px;height:38px;font-size:13px}
  .zone-lbl{font-size:14px;padding:1px 8px}
  .gauge-name{display:none}
  .guide{font-size:14px;padding:7px 14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px)}
  .pop.hit{font-size:20px}.pop.gold{font-size:22px}.pop.mile{font-size:38px}

  #resultScreen{place-items:end stretch;padding:0 0 env(safe-area-inset-bottom,0px);background:linear-gradient(to top,#0a0614cc 0,#0a061400 45%)}
  .slip{box-sizing:border-box;width:100%;max-height:56vh;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));transform:none;border-radius:0}
  .slip-head{padding-bottom:4px}
  .slip-title{font-size:20px;letter-spacing:.15em}
  .slip-shop{font-size:12px}
  .slip-no{font-size:10px;margin-top:2px}
  .slip-total{margin:4px 0 2px}
  .slip-total>span{font-size:14px}
  .slip-total b{font-size:44px}
  .stamp,.stamp.new{position:static;display:inline-grid;place-items:center;writing-mode:horizontal-tb;width:auto;height:auto;border-radius:4px;font-size:13px;padding:2px 10px;margin:0 6px 4px 0;transform:rotate(-3deg);box-shadow:none;border-width:2px}
  .stamp.new{border-radius:999px}
  .stamp.new.slam{animation-name:slamM}
  .record-line{font-size:13px;padding:4px 8px;margin:2px 0}
  .record-line b{font-size:16px}
  .items{grid-template-columns:repeat(3,1fr);column-gap:10px;padding:4px 0;margin:6px 0}
  .items div{font-size:12px;padding:1px 0}
  .meta{grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;font-size:11px;margin:0 0 10px}
  .meta dt{font-size:12px}
  .actions{gap:8px}
  .actions .btn{font-size:16px;padding:7px 16px}
  .btn.ghost{font-size:13px;padding:7px 12px}
  .panel-toggle{font-size:13px;margin-top:4px}
  .drag-hint{display:none}
  .peek{font-size:15px;padding:7px 14px}

  #titleScreen{padding-top:calc(min(12vh,90px) + 8px)}
  .noren{height:min(12vh,90px)}
  .noren i{font-size:26px;width:1.5em;height:1.5em;margin-top:4px}
  .title-col{gap:10px}
  .signboard{padding:14px 14px 10px}
  .menu{padding:4px 14px}
  .steps li{padding:9px 0;gap:10px}
  .steps .num{width:30px;height:30px;font-size:16px}
  .steps b{font-size:15px}
  .steps small{font-size:12px}
}

/* ===== simple receipt: total, stamps, one line about the best, buttons ===== */
.slip-head{border-bottom:2px solid var(--shu)}
.slip-total{justify-content:center;margin:14px 0 6px}
.slip-total b{font-size:clamp(64px,12vw,84px)}
.stamps{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:12px;min-height:34px}
.stamps .stamp,.stamps .stamp.new{position:static;display:inline-grid;place-items:center;writing-mode:horizontal-tb;width:auto;height:auto;border-radius:4px;font-size:15px;padding:3px 12px;margin:0;transform:rotate(-3deg);box-shadow:none;border-width:2px}
.stamps .stamp.new{border-radius:999px}
.stamps .stamp.new.slam{animation-name:slamM}
.record-line{margin:0 0 6px;padding:0;background:none;border:none;font-family:var(--font-body);font-weight:900;font-size:14px;color:var(--sumi);opacity:.75}
.record-line.is-new{color:var(--shu);opacity:1}
.planet-line{text-align:center;font-family:var(--font-body);font-weight:900;font-size:13px;color:var(--shu);margin:0 0 6px}
.slip .actions{margin-top:14px}
@media (max-width:640px){
  .slip{max-height:none;padding-top:14px;padding-bottom:22px}
  .slip-total{margin:6px 0 4px}
  .slip-total b{font-size:58px}
  .stamps{margin-bottom:8px}
  .stamps .stamp,.stamps .stamp.new{font-size:13px;padding:2px 10px}
  .record-line{font-size:13px}
  .slip .actions{margin-top:10px}
}

/* ===== result: one small card with the score and two buttons; the finished skewer turns behind it ===== */
#resultScreen,#resultScreen[class]{place-items:end center;padding:0 16px calc(9vh + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 85%,#0a061499,#0a061400 60%);pointer-events:none}
.result-card{pointer-events:auto;box-sizing:border-box;width:min(340px,100%);padding:22px 22px 18px;border-radius:18px;background:rgba(29,19,13,.9);border:1px solid rgba(243,232,207,.14);
  box-shadow:0 18px 40px #000a;display:flex;flex-direction:column;gap:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rc-score{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:8px;color:#fff6e6;white-space:nowrap}
.rc-score span{font-family:var(--font-num);font-size:clamp(60px,15vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.rc-score small{font-family:var(--font-body);font-weight:900;font-size:18px}
.rc-btn{font-family:var(--font-body);font-weight:900;font-size:17px;padding:13px;border-radius:12px;border:none;cursor:pointer;color:#fff6e6;background:rgba(243,232,207,.1)}
.rc-btn.primary{color:var(--sumi);background:var(--paper);box-shadow:inset 0 -3px 0 rgba(120,90,50,.25)}
.result-card .copied{margin:-4px 0 0;min-height:0;color:var(--ember);text-align:center;font-size:12px}

/* ===== minimal HUD: plain count top-left, one round sound button top-right ===== */
.tag{background:none;border:none;box-shadow:none;padding:0;min-width:0;transform:none;align-items:flex-start}
.tag::before,.tag::after{display:none}
.tag-num{color:#fff6e6;font-size:clamp(44px,8vw,64px);text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.55)}
.tag-num small{font-family:var(--font-body);font-weight:900;font-size:.3em;margin-left:4px}
.tag{pointer-events:auto}
.tag-best{border:none;padding:0;margin-top:2px;color:rgba(255,246,230,.75);font-size:12px;text-shadow:0 1px 3px #000}
.tag.beat{box-shadow:none}
.tag.beat .tag-num,.tag.record .tag-best{color:#ffd84a}
.sound-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff6e6;background:rgba(10,6,20,.45);border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sound-btn:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
@media (max-width:640px){ .tag{padding:0;transform:none} .tag-num{font-size:44px} .tag-best{font-size:11px} .sound-btn{width:38px;height:38px} }
@keyframes slamM{0%{transform:rotate(-30deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-3deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop,#center.bang,.tag.record,.stamp.new.slam{animation-duration:.01s}#confetti{display:none}.noren span{animation:none}}
</style>

<body>
<div id="app">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
// demo mode for recording: open with #demo, or tap the score three times. It throws a perfect shot and flies itself.
let DEMO = location.hash === '#demo', demoT = 0;

/* ---------- renderer / scene ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.autoClear = false;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1436, 40, 150);
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 6000);   // far enough to see a very long skewer end to end
const START_CAM = new THREE.Vector3(0,4.6,16);
camera.position.copy(START_CAM);

scene.add(new THREE.HemisphereLight(0x7d6ab8, 0x3a1a0a, 0.8));
const key = new THREE.DirectionalLight(0xfff4e6, 1.15); key.position.set(4,10,14); scene.add(key); scene.add(key.target);
const emberLight = new THREE.PointLight(0xff7a2a, 2.2, 26, 1.6); emberLight.position.set(0,1.5,8); scene.add(emberLight);
const tipLight = new THREE.PointLight(0xffd8b0, 0, 14, 1.8); scene.add(tipLight);

// see-through textures are built from raw pixels (not a 2D canvas): iPhones scramble the colour of
// nearly-transparent canvas pixels, which showed up as rainbow noise wherever glows and clouds overlap
function rawTex(S, fn){
  const d = new Uint8Array(S*S*4);
  for (let j=0;j<S;j++) for (let i=0;i<S;i++){
    const c = fn((i+.5)/S, (j+.5)/S), k = (j*S+i)*4;
    d[k] = c[0]; d[k+1] = c[1]; d[k+2] = c[2]; d[k+3] = Math.max(0, Math.min(255, c[3]*255));
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}
const glowTex = rawTex(64, (u,v) => {
  const r = Math.min(1, Math.hypot(u-.5, v-.5)*2);
  const a = r < .35 ? 1 - r/.35*.45 : .55*(1 - (r-.35)/.65);
  return [255,255,255, a*a*(3-2*a) > 0 ? a : 0];
});

// ground that scrolls
const groundTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
  g.fillStyle = '#1a1220'; g.fillRect(0,0,256,256);
  g.fillStyle = '#241828'; for (let y=0;y<256;y+=32) for (let x=(y/32)%2*32;x<256;x+=64) g.fillRect(x+2,y+2,60,28);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(20,40); return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,480), new THREE.MeshLambertMaterial({map:groundTex}));
ground.rotation.x = -Math.PI/2; ground.position.y = -3; scene.add(ground);

/* ---------- grill at the start ---------- */
const L = new THREE.Vector3(0,1.6,8);
const embers = [];
{
  // 屋台の焼き台: a long galvanised steel box, sooty and stained, with air holes along the front
  const steelCv = document.createElement('canvas'); steelCv.width = 512; steelCv.height = 128; const sg = steelCv.getContext('2d');
  const sgr = sg.createLinearGradient(0,0,0,128); sgr.addColorStop(0,'#5e5c58'); sgr.addColorStop(1,'#8a8884'); sg.fillStyle = sgr; sg.fillRect(0,0,512,128);
  for (let i=0;i<500;i++){ sg.fillStyle = Math.random()<.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)'; sg.fillRect(rand(0,512), rand(0,128), rand(2,14), rand(1,3)); }
  for (let i=0;i<40;i++){ const x = rand(0,512), w = rand(3,12); const dg = sg.createLinearGradient(0,0,0,rand(30,110));
    dg.addColorStop(0,'rgba(30,22,16,.55)'); dg.addColorStop(1,'rgba(30,22,16,0)'); sg.fillStyle = dg; sg.fillRect(x,0,w,128); }   // soot drips
  const top = sg.createLinearGradient(0,0,0,30); top.addColorStop(0,'rgba(20,14,10,.8)'); top.addColorStop(1,'rgba(20,14,10,0)'); sg.fillStyle = top; sg.fillRect(0,0,512,30);
  for (let x=30;x<512;x+=58){ sg.fillStyle = '#0d0907'; sg.beginPath(); sg.arc(x, 78, 6, 0, 7); sg.fill();
    sg.strokeStyle = 'rgba(160,158,150,.35)'; sg.lineWidth = 1.5; sg.stroke(); }                                              // air holes
  const steelTex = new THREE.CanvasTexture(steelCv); steelTex.anisotropy = 8;
  const steelM = new THREE.MeshStandardMaterial({map:steelTex, roughness:.62, metalness:.55, envMapIntensity:.6});
  const body = new THREE.Mesh(new THREE.BoxGeometry(9.4, 1.2, 2.1), steelM); body.position.set(0, 0.16, 8); scene.add(body);
  // dark inside walls above the coal bed, and a rolled rim around the top
  const rimM = new THREE.MeshStandardMaterial({color:0x3a3633, roughness:.5, metalness:.7});
  [[0, 9.5, .12, 8 + 1.05], [0, 9.5, .12, 8 - 1.05]].forEach(([x, w, h, z]) => { const r = new THREE.Mesh(new THREE.BoxGeometry(w, h, .1), rimM); r.position.set(x, 0.86, z); scene.add(r); });
  [-4.7, 4.7].forEach(x => { const r = new THREE.Mesh(new THREE.BoxGeometry(.1, .12, 2.2), rimM); r.position.set(x, 0.86, 8); scene.add(r); });
  const legM = new THREE.MeshStandardMaterial({color:0x3e3c3a, roughness:.6, metalness:.6});
  [-4.3,4.3].forEach(x => [7.2, 8.8].forEach(z => { const leg = new THREE.Mesh(new THREE.BoxGeometry(.12,3.4,.12), legM); leg.position.set(x,-1.9,z); scene.add(leg); }));
  // 金網: fine woven wire mesh resting on the rim (alpha-tested so the coals glow through the gaps)
  const meshTex = rawTex(32, (u,v) => { const gx = Math.abs(u - .5) > .38, gy = Math.abs(v - .5) > .38; return gx || gy ? [255,255,255,1] : [0,0,0,0]; });
  meshTex.wrapS = meshTex.wrapT = THREE.RepeatWrapping; meshTex.repeat.set(110, 25); meshTex.anisotropy = 8;
  const wire = new THREE.Mesh(new THREE.PlaneGeometry(9.3, 2.0), new THREE.MeshStandardMaterial({color:0x2c2622, alphaMap:meshTex, alphaTest:.5, side:THREE.DoubleSide,
    metalness:.75, roughness:.4, emissive:0x3a1404, emissiveIntensity:.6}));
  wire.rotation.x = -Math.PI/2; wire.position.set(0, 0.96, 8); scene.add(wire);
  // binchotan: dark grey sticks whose cracks glow orange (emissive map), breathing in and out
  const crackCv = document.createElement('canvas'); crackCv.width = crackCv.height = 256;
  const cg = crackCv.getContext('2d'); cg.fillStyle = '#000'; cg.fillRect(0,0,256,256);
  cg.lineCap = 'round';
  for (let i=0;i<26;i++){
    let x = rand(0,256), y = rand(0,256), a = rand(0,6.28);
    cg.strokeStyle = Math.random()<.5 ? '#ffb347' : '#ff6a1a'; cg.lineWidth = rand(1,3.2); cg.shadowColor = '#ff7a2a'; cg.shadowBlur = 8;
    cg.beginPath(); cg.moveTo(x,y);
    for (let k=0;k<10;k++){ a += rand(-.9,.9); x += Math.cos(a)*rand(6,16); y += Math.sin(a)*rand(6,16); cg.lineTo(x,y); }
    cg.stroke();
  }
  const crackTex = new THREE.CanvasTexture(crackCv);
  const ashCv = document.createElement('canvas'); ashCv.width = ashCv.height = 128; const ag = ashCv.getContext('2d');
  ag.fillStyle = '#2b2826'; ag.fillRect(0,0,128,128);
  for (let i=0;i<600;i++){ ag.fillStyle = Math.random()<.5 ? 'rgba(90,85,80,.5)' : 'rgba(10,8,6,.6)'; ag.fillRect(rand(0,128),rand(0,128),rand(1,3),rand(1,3)); }
  const ashTex = new THREE.CanvasTexture(ashCv);
  const coalGeo = new THREE.DodecahedronGeometry(0.15,1);
  for (let i=0;i<46;i++){
    const m = new THREE.Mesh(coalGeo, new THREE.MeshStandardMaterial({map:ashTex, color:0x9a9088, roughness:1, emissive:0xff6a1a, emissiveMap:crackTex, emissiveIntensity:rand(.8,1.6)}));
    m.scale.set(rand(1.6,2.6), rand(.8,1), rand(.8,1));
    m.position.set(rand(-4.1,4.1), 0.76+rand(0,.08), 8+rand(-.62,.62)); m.rotation.set(rand(-.2,.2), rand(0,6.28), rand(-.2,.2)); scene.add(m);
    embers.push({m, ph:rand(0,6.28), sp:rand(1.5,4)});
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xff6a22, transparent:true, opacity:.5, blending:THREE.AdditiveBlending, depthWrite:false}));
  glow.scale.set(13,3,1); glow.position.set(0,1,8.2); scene.add(glow);
}

/* ---------- lanterns along the route ---------- */
function lanternTexture(){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#d8331f'; g.fillRect(0,0,512,256);
  g.strokeStyle = 'rgba(80,10,0,.35)'; g.lineWidth = 3;
  for (let y=10;y<256;y+=18){ g.beginPath(); g.moveTo(0,y); g.lineTo(512,y); g.stroke(); }
  g.fillStyle = '#1a0805'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '64px "Dela Gothic One", "Hiragino Mincho ProN", serif';
  [128, 384].forEach(x => { g.fillText('焼', x, 82); g.fillText('鳥', x, 168); });
  return new THREE.CanvasTexture(cv);
}
const lanternTex = lanternTexture();
const lanterns = [];
{
  const pts = []; for (let i=0;i<=14;i++){ const t=i/14; pts.push(new THREE.Vector2(0.5+0.42*Math.sin(Math.PI*t), (t-.5)*1.9)); }
  const geo = new THREE.LatheGeometry(pts, 24);
  const mat = new THREE.MeshStandardMaterial({map:lanternTex, emissive:0xff4a22, emissiveMap:lanternTex, emissiveIntensity:1, roughness:.8, side:THREE.DoubleSide});
  const capM = new THREE.MeshStandardMaterial({color:0x111111});
  const capG = new THREE.CylinderGeometry(.42,.42,.18,16);
  for (let i=0;i<14;i++){

function genCorridor(z0, short){
  const n = short ? 8 + (Math.random()*9|0) : 34 + (Math.random()*26|0), gap = 1.15;   // short roads: 8–16, long roads: 34–59
  const x0 = rand(-XMAX*.45, XMAX*.45), y0 = rand(YMIN+3, YMAX-3);

    addPiece(Math.random() < .55 ? t : pickType(), x, y, z);

function genSegment(z0){
  segCount++;
  if (segCount % 6 === 2) return genCorridor(z0);                 // a long road every so often
  if (Math.random() < .3) return genCorridor(z0, true);          // and plenty of short ones in between
  const r = Math.random();
  if (Math.random() < goldChance(8 - z0)){ // golden boost: steady on earth, rarer the deeper into space
    addPiece('gold', rand(-XMAX*.8, XMAX*.8), rand(YMIN+1, YMAX-2), z0 - 5);
  }

    const x = rand(-XMAX*.85, XMAX*.85), y = rand(YMIN+.5, YMAX-.5), n = 6 + (Math.random()*5|0), t = pickType();
    for (let i=0;i<n;i++) addPiece(Math.random()<.7 ? t : pickType(), x, y, z0 - i*1.3);
    return 1.3*n + 4;
  } else if (r < .54){ // slanted line: steer to follow it

    const dx = rand(-.35,.35), dy = rand(-.25,.25), n = 8 + (Math.random()*4|0);

    return 1.4*n + 4;
  } else if (r < .68){ // spiral
    const cx = rand(-XMAX*.5, XMAX*.5), cy = rand(YMIN+3, YMAX-3), n = 12; let a = rand(0,6.28);
    for (let i=0;i<n;i++){ addPiece(pickType(), cx + Math.cos(a)*2.4, cy + Math.sin(a)*2.4, z0 - i*1.5); a += .55; }

}

  const r = canvas.getBoundingClientRect();
  if (e.pointerType === 'touch' || e.pointerType === 'pen'){
    if (!touchLast || touchLast.id !== e.pointerId){ touchLast = {id:e.pointerId, x:e.clientX, y:e.clientY}; return; }
    if (state === 'fly'){
      steer.x = clamp(steer.x + (e.clientX - touchLast.x)*2/(r.width*.55), -1, 1);
      steer.y = clamp(steer.y - (e.clientY - touchLast.y)*2/(r.height*.4), -1, 1);
    }
    touchLast.x = e.clientX; touchLast.y = e.clientY;
    return;

function launch(){

  sk.maxV = sk.v;

  showGuide(TOUCH ? 'どこでもスライドして <b>刺しまくれ</b>' : 'マウスで串を動かして <b>刺しまくれ</b>');

const RANKS = [[0,'見習い'],[10,'焼き場担当'],[30,'串打ち職人'],[60,'炭火の鬼'],[100,'伝説の大将'],[160,'串の神']];
function rankOf(s){ let r = RANKS[0][1]; RANKS.forEach(([n,t]) => { if (s >= n) r = t; }); return r; }
const kmh = v => Math.round(v*3.6);
const distD = () => Math.max(0, L.z - sk.pos.z);
let zoneIdx = 0;
const placeName = () => planetsHit.length ? planetsHit[planetsHit.length-1].name : ZONES[zoneIdx].name;

  _v.set(0,0,1).applyQuaternion(sk.obj.quaternion);
  orbit.base = Math.atan2(_v.x, _v.z) + Math.PI/2; orbit.yaw = 0; orbit.el = .28; orbit.zoom = 1; orbit.idle = 99;

      + planetsHit.map(p => `<div class="planet-row"><span>${p.name}</span><b>時価</b></div>`).join('');

    const fa = fmtAlt(altM(distD())); $('rDist').textContent = fa[0] + fa[1];
    $('rZone').textContent = placeName();
    $('rSpeed').textContent = kmh(sk.maxV) + 'km';
    $('rPower').textContent = powerLabel();
    $('rBest').textContent = best + '個';

$('copyBtn').addEventListener('click', () => {

    : `爆速焼き鳥ダーツで、串1本に焼き鳥を${sk.n}個ぶっ刺した！（${rankOf(sk.n)}／到達地点：${ZONES[zoneIdx].name}）`;

function whiteFlash(){ const f = $('whiteflash'); f.style.transition = 'none'; f.style.opacity = 1;
  setTimeout(() => { f.style.transition = 'opacity .7s ease-out'; f.style.opacity = 0; }, 90); }

/* ---------- resize ---------- */
let aspect = 1;

  const w = innerWidth, h = innerHeight; aspect = w/h;
  renderer.setSize(w, h, false); camera.aspect = aspect; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- update ---------- */
const ab = new THREE.Vector3(), ap = new THREE.Vector3(), cl = new THREE.Vector3();
function segDist(p, a, b){
  ab.subVectors(b,a); const l2 = ab.lengthSq();
  let t = l2 ? ap.subVectors(p,a).dot(ab)/l2 : 0; t = clamp(t,0,1);
  cl.copy(a).addScaledVector(ab,t); return p.distanceTo(cl);
}
const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3(0,5,-20), lookCur = new THREE.Vector3(0,5,-20);
let smokeT = 0, steamT = 0;

function update(dt, t, rdt){
  rdt = rdt || dt;
  // gauge
  if (state === 'aim'){
    aimT += dt;
    gaugePhase += dt * 2.3;
    gauge = 1 - Math.abs((gaugePhase % 2) - 1);
    $('marker').style.top = ((1 - gauge)*100) + '%';
    const zl = $('zoneLbl');
    zl.textContent = gauge >= GOD ? '神' : gauge >= PERFECT ? '爆速' : gauge >= .6 ? '強' : '弱';
    zl.classList.toggle('hot', gauge >= PERFECT);
  }

  // keyboard steering
  if (state === 'fly'){
    const kx = (keys.ArrowRight||keys.KeyD ? 1 : 0) - (keys.ArrowLeft||keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowUp||keys.KeyW ? 1 : 0) - (keys.ArrowDown||keys.KeyS ? 1 : 0);
    if (kx || ky){ steer.x = clamp(steer.x + kx*dt*2, -1, 1); steer.y = clamp(steer.y + ky*dt*2, -1, 1); }
  }
  if (DEMO && state === 'fly'){
    // autopilot: go for the planet if one is out, otherwise the nearest yakitori a little way ahead
    demoT += dt;
    let tgt = pendingPlanet ? pendingPlanet.g.position : null;
    if (!tgt){
      let bestD = 1e9;
      for (const pc of pieces){
        if (!pc.alive) continue;
        const dz = sk.pos.z - pc.g.position.z; if (dz < 3 || dz > 60) continue;
        const sc = dz + (Math.abs(pc.g.position.x - sk.pos.x) + Math.abs(pc.g.position.y - sk.pos.y))*4;
        if (sc < bestD){ bestD = sc; tgt = pc.g.position; }
      }
    }
    if (tgt){
      steer.x = lerp(steer.x, clamp(tgt.x/XMAX, -1, 1), 1 - Math.exp(-5*dt));
      steer.y = lerp(steer.y, clamp((tgt.y - YMIN)/(YMAX - YMIN)*2 - 1, -1, 1), 1 - Math.exp(-5*dt));
    }
  }

  // skewer
  sk.prev.copy(sk.pos);
  if (state === 'aim' || state === 'title'){
    sk.pos.copy(L);
    const tx = steer.x*XMAX*.6, ty = lerp(YMIN, YMAX, steer.y*.5+.5);
    sk.obj.position.copy(sk.pos);
    sk.obj.lookAt(tx, ty, -25);
    sk.obj.visible = state === 'aim';
  } else if (state === 'fly'){
    sk.obj.visible = true;
    const drag = sk.perfect ? (1.5 + .028*sk.v) : (2.2 + .04*sk.v);
    sk.v -= drag*dt;
    if (DEMO && distD() < SPACE_D) sk.v += drag*dt*.7;   // demo: zip up to space, then normal physics until it stops on its own
    sk.v -= drag*dt*Math.min(1.2, .06*planetsHit.length);       // planets are heavy
    if (sk.braking) sk.v -= 22*dt;                            // the sun stops everything
    const tx = steer.x*XMAX, ty = lerp(YMIN, YMAX, steer.y*.5+.5);
    sk.vx = lerp(sk.vx, clamp((tx - sk.pos.x)*2.6, -15, 15), 1 - Math.exp(-8*dt));
    sk.vy = lerp(sk.vy, clamp((ty - sk.pos.y)*2.6, -15, 15), 1 - Math.exp(-8*dt));
    sk.pos.x += sk.vx*dt; sk.pos.y += sk.vy*dt; sk.pos.z -= Math.max(sk.v,0)*dt;
    sk.obj.position.copy(sk.pos);
    sk.obj.lookAt(_v.set(sk.pos.x + sk.vx*.5, sk.pos.y + sk.vy*.5, sk.pos.z - Math.max(sk.v, 8)));

    // pierce
    for (const p of pieces){
      if (!p.alive) continue;
      if (p.g.position.z > sk.prev.z + 2 || p.g.position.z < sk.pos.z - 2) continue;
      const hitR = p.r + (sk.perfect ? .95 : .7) + (TOUCH ? .2 : 0);   // generous, so sweeping through a cluster feels good
      if (segDist(p.g.position, sk.prev, sk.pos) < hitR){
        p.alive = false;
        const wp = p.g.position.clone();
        scene.remove(p.g); sk.obj.add(p.g);
        attachFront(p.g, PIECE_GAP);
        p.g.rotation.set(0, 0, rand(0, 6.28));
        p.g.userData.punch = .2;
        sk.n++; byType[p.type]++;
        updateSkewerShape();
        if (p.type === 'gold'){
          sk.v = Math.min(sk.v + 30, 125); SFX.gold(); flash();
          popup('再加速！', wp.clone().add(_w.set(0,1.2,0)), 'gold');
        } else {
          sk.v -= sk.perfect ? .28 : .5;
        }
        SFX.hit(sk.n, p.type);
        burst(wp, sk.perfect ? 12 : 7, [0xffd27a, 0xff7a2a, 0xffffff], sk.perfect ? 9 : 5);
        for (let j=0;j<6;j++) spark(wp, 0xffb44a, rand(.12,.22), rand(.4,.7), _w.set(rand(-3,3), rand(1,4), rand(-2,2)));
        // milestones: every 50
        if (sk.n % 50 === 0){ popup(`${sk.n}個！`, wp.clone().add(_w.set(0,2,0)), 'mile'); SFX.mile(); }
        else { const ws = HIT_WORDS[p.type]; popup(ws[Math.random()*ws.length|0], wp, 'hit'); }
        shake = Math.max(shake, reduceMotion ? .02 : .1);
      }
    }
    sk.maxV = Math.max(sk.maxV, sk.v);
    if (pendingPlanet){
      const pg = pendingPlanet.g, pr = pendingPlanet.def.r;
      pendingPlanet.body.rotation.y += dt*.4;
      if (segDist(pg.position, sk.prev, sk.pos) < pr*.95) impalePlanet();
      else if (pg.position.z > sk.pos.z + 12){ scene.remove(pg); pendingPlanet = null; showGuide(''); planetChain = 0; chainRoll = false; }   // missed it: streak over
    }
    const dd = distD();
    while (zoneIdx < ZONES.length-1 && dd >= ZONES[zoneIdx+1].d){
      zoneIdx++; const z = ZONES[zoneIdx];
      bigText(z.msg, 1600); SFX.mile(); if (z.big) flash();
    }
    // in space, now and then a random planet shows up (each one at most once)
    if (dd >= SPACE_D && !pendingPlanet && !sk.braking && dd >= nextPlanetRoll){
      nextPlanetRoll = dd + (DEMO ? 18 : PLANET_ROLL_EVERY);
      const chance = DEMO ? Math.max(PLANET_CHANCE, chainRoll ? chainChance(planetChain) : .6) : chainRoll ? chainChance(planetChain) : PLANET_CHANCE;
      const hit = Math.random() < chance;
      if (!hit){ planetChain = 0; chainRoll = false; }   // streak ends when the lucky roll fails
      if (hit){
        const wOf = pl => pl.w * (planetsHit.includes(pl) ? .45 : 1);
        let r = Math.random()*PLANETS.reduce((a, pl) => a + wOf(pl), 0);
        for (const pl of PLANETS){ r -= wOf(pl); if (r <= 0){ spawnPlanet(pl); break; } }
      }
    }
    // trail
    const fast = sk.v > 70;
    for (let k=0;k<(fast ? 3 : 1);k++){
      _v.lerpVectors(sk.prev, sk.pos, k/3);
      if (fast) spark(_v, k%2 ? 0xff6a1a : 0xffd27a, rand(.4,.8), .25, null);
      else if (Math.random() < .5) spark(_v, 0xfff2d0, .2, .2, null);
    }
    if (sk.v <= 2.5){ sk.v = 0; finish(); }
  }
  // punch scale on attached pieces
  sk.attached.forEach(g => { if (g.userData.planet && Math.abs(g.userData.fade - g.userData.fadeTo) > .002){ g.userData.fade = lerp(g.userData.fade, g.userData.fadeTo, 1 - Math.exp(-6*rdt)); setPlanetFade(g, g.userData.fade); }
    if (g.userData.tz !== undefined) g.position.z = lerp(g.position.z, g.userData.tz, 1 - Math.exp(-22*dt)); if (g.userData.punch > 0){ g.userData.punch -= dt; g.scale.setScalar(1 + Math.max(0,g.userData.punch)/.2*.45); } });

  // field upkeep
  if (state === 'fly' || state === 'aim'){
    fillField(sk.pos.z - 170);
  }
  const behind = camera.position.z + 3;
  for (let i=pieces.length-1;i>=0;i--){
    const p = pieces[i];
    if (!p.alive){ pieces.splice(i,1); continue; }
    if (p.g.position.z > behind){ scene.remove(p.g); pieces.splice(i,1); continue; }
    p.g.position.y = p.base.y + Math.sin(t*1.6 + p.bob)*.25;
    p.g.position.x = p.base.x + Math.cos(t*1.1 + p.bob)*.15;
    p.g.rotation.x += p.spin.x*dt; p.g.rotation.y += p.spin.y*dt;
    updateGlints(p.g, t);
    if (p.type === 'gold' && Math.random() < .25) spark(p.g.position, 0xffd24a, .35, .4, _w.set(rand(-.5,.5), rand(-.5,.5), 0));
  }
  // lanterns recycle
  for (let i=roads.length-1;i>=0;i--){
    const rd = roads[i];
    if (rd.z > behind){ roads.splice(i,1); continue; }
    if (!rd.told && state === 'fly' && sk.pos.z < rd.z + 30){ rd.told = true; bigText('焼き鳥ロード！', 1300); SFX.mile(); }
  }
  lanterns.forEach(g => { if (g.position.z > camera.position.z + 5 && distD() < 80) g.position.z -= 7*30; g.rotation.y = t*.2; g.rotation.z = Math.sin(t*1.3 + g.position.z)*.06; });

  sk.attached.forEach(g => updateGlints(g, t));
  // steam rising off hot yakitori
  steamT -= dt;
  if (steamT <= 0){
    steamT = .05;
    if ((state === 'show' || state === 'result') && sk.attached.length){
      const g = sk.attached[Math.random()*sk.attached.length|0]; g.getWorldPosition(_v); steam(_v);
    } else if (pieces.length){
      const p = pieces[Math.random()*pieces.length|0];
      if (p.alive && camera.position.distanceTo(p.g.position) < 32) steam(p.g.position);
    }
  }
  // particles
  smokeT -= dt; if (smokeT <= 0){ smokeT = .1; smoke(); }
  for (const s of sparks){ if (!s.on) continue; s.life -= dt;
    if (s.life <= 0){ s.on = false; s.sp.visible = false; continue; }
    s.sp.position.addScaledVector(s.vel, dt); s.vel.multiplyScalar(1 - 3*dt);
    const k = s.life/s.max; s.sp.material.opacity = k; s.sp.scale.setScalar(s.size*(0.5+0.5*k)); }
  for (const s of smokes){ if (!s.on) continue; s.life -= dt;
    if (s.life <= 0){ s.on = false; s.sp.visible = false; continue; }
    s.sp.position.addScaledVector(s.vel, dt);
    const k = s.life/s.max; s.sp.material.opacity = .13*Math.sin(Math.PI*k); s.sp.scale.setScalar(s.size*(1 + (1-k)*3)); }
  embers.forEach(e => { e.m.material.emissiveIntensity = 1.1 + .6*Math.sin(t*e.sp + e.ph) + .25*Math.sin(t*e.sp*2.7 + e.ph*1.3); });
  if (camera.position.z > -40) updateFlames(dt, t);   // only while the grill can be seen

  // camera
  const portrait = aspect < 1 ? (1 - aspect)*6 : 0;
  if (state === 'fly'){
    camTarget.set(sk.pos.x*.75, sk.pos.y + 2.4, sk.pos.z + 9 + portrait);
    lookTarget.set(sk.pos.x*.9, sk.pos.y + .3, sk.pos.z - 24);
    let fovT = 58 + clamp(sk.v/110,0,1)*24, rate = 7*dt;
    if (cine){
      // ease in fast, hold, ease back out
      const w = sstep(0, .18, cine.t) * (1 - sstep(cine.dur - .45, cine.dur, cine.t));
      cine.g.getWorldPosition(_v);
      const R = cine.r*3.2 + 4;
      _w.set(_v.x + cine.side*R, _v.y + cine.r*.9 + 1, _v.z + cine.r*1.1 + 2);
      camTarget.lerp(_w, w);
      lookTarget.lerp(_v, w);
      fovT = lerp(fovT, 50, w);
      rate = 9*rdt;
    }
    camera.position.lerp(camTarget, 1 - Math.exp(-rate));
    camera.fov = lerp(camera.fov, fovT, 1 - Math.exp(-(cine ? 6*rdt : 3*dt)));
  } else if (state === 'show' || state === 'result'){
    showT += dt; orbit.idle += dt;
    const len = skewerLength();
    _v.set(0,0,-len/2 - .3); sk.obj.localToWorld(_v);
    // distance that fits the whole skewer on screen, then the viewer's zoom
    const halfV = THREE.MathUtils.degToRad(camera.fov/2), halfH = Math.atan(Math.tan(halfV)*aspect);
    const usable = orbit.panel && state === 'result' ? .85 : 1;
    const R = Math.max(4, ((len/2 + .8 + (sk.pad || 0)) / Math.tan(Math.min(halfH*usable, halfV*1.6)))*1.08) * orbit.zoom;
    if (!orbit.drag && orbit.idle > 2.5) orbit.yaw += dt*.12;
    const yaw = orbit.base + orbit.yaw + Math.sin(showT*.35)*.15, el = orbit.el;
    camTarget.set(_v.x + Math.sin(yaw)*Math.cos(el)*R, _v.y + Math.sin(el)*R, _v.z + Math.cos(yaw)*Math.cos(el)*R);
    camera.position.lerp(camTarget, 1 - Math.exp(-(orbit.drag ? 10 : 3)*dt));
    lookTarget.copy(_v);
    camera.fov = lerp(camera.fov, 50, 1 - Math.exp(-3*dt));
    scene.fog.near = R + 30; scene.fog.far = R*2 + 160;
    sk.obj.rotateZ(dt*.5);
  } else {
    camTarget.copy(START_CAM); camTarget.z += portrait;
    camera.position.lerp(camTarget, 1 - Math.exp(-4*dt));
    lookTarget.set(0, 5, -20);
    camera.fov = lerp(camera.fov, 58, 1 - Math.exp(-3*dt));
  }
  if (state !== 'show' && state !== 'result'){ scene.fog.near = 40; scene.fog.far = 150; }
  lookCur.lerp(lookTarget, 1 - Math.exp(-(cine ? 12*rdt : 8*dt)));
  shake = Math.max(0, shake - dt*2);
  camera.position.x += rand(-1,1)*shake; camera.position.y += rand(-1,1)*shake;
  camera.lookAt(lookCur);
  // push the skewer out from behind the result panel
  const wantOff = state === 'result' && orbit.panel ? 1 : 0;
  orbit.off = lerp(orbit.off, wantOff, 1 - Math.exp(-5*dt));
  if (orbit.off > .002){
    const W = innerWidth, Hh = innerHeight;
    const ox = 0, oy = Hh*(W <= 640 ? .22 : .16)*orbit.off;   // lift the skewer above the score card
    camera.setViewOffset(W, Hh, ox, oy, W, Hh); envCam.setViewOffset(W, Hh, ox, oy, W, Hh);
  } else if (camera.view && camera.view.enabled){ camera.clearViewOffset(); envCam.clearViewOffset(); }
  camera.updateProjectionMatrix();

  const dNow = distD();
  updateEnv(dNow, t);
  ground.position.y = -3 - Math.max(0, dNow - 20)*1.5;
  ground.visible = dNow < 200;
  ground.position.z = camera.position.z - 120; ground.position.x = camera.position.x;
  groundTex.offset.set(camera.position.x/12, -camera.position.z/12);
  rim.position.set(camera.position.x - 6, 12, camera.position.z - 45); rim.target.position.set(camera.position.x, 5, camera.position.z - 10);
  key.position.set(camera.position.x + 4, 14, camera.position.z + 6); key.target.position.set(camera.position.x, 5, camera.position.z - 20);
  tipLight.position.copy(sk.pos); tipLight.intensity = state === 'fly' ? clamp(sk.v/120, .15, .7) : 0;

  // wind
  if (wind && ac){
    const w = state === 'fly' ? clamp(sk.v/110, 0, 1) : 0;
    wind.g.gain.setTargetAtTime(w*.18, ac.currentTime, .1);
    const nearGrill = (state === 'title' || state === 'aim') ? .09 : (state === 'show' || state === 'result') ? .05 : .02*(1 - smooth(0, 60, distD()));
    grillHiss.gain.setTargetAtTime(nearGrill, ac.currentTime, .3);
    wind.fl.frequency.setTargetAtTime(300 + w*1600, ac.currentTime, .1);
  }

  // HUD
  $('score').textContent = sk.n;
  if (state === 'fly' && !sk.beat && prevBest > 0 && sk.n > prevBest){
    sk.beat = true;
    const tag = $('hud').querySelector('.tag'); tag.classList.remove('record'); void tag.offsetWidth; tag.classList.add('record', 'beat');
    $('hudBest').textContent = 'ベスト更新中！';
    SFX.record(false);
    popup('自己ベスト突破！', sk.pos.clone().add(_w.set(0, 2.2, -5)), 'gold');
    burst(sk.pos, 40, [0xffd84a, 0xffffff, 0xff6a2f], 12);
  }
  const sp = $('speed'); sp.firstChild.nodeValue = state === 'fly' ? kmh(Math.max(sk.v,0)) : 0;
  sp.classList.toggle('fast', state === 'fly' && sk.v > 70);
  const al = fmtAlt(altM(dNow)); $('dist').innerHTML = `${al[0]}<small>${al[1]}</small>`;
  $('zone').textContent = placeName();
  $('lines').style.opacity = state === 'fly' ? clamp((sk.v - 40)/70, 0, .9) : 0;
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const real = Math.min(.05, (now - last)/1000); last = now;
  let ts = 1;
  if (hitStop > 0){ hitStop = Math.max(0, hitStop - real); ts = .02; }
  else if (slowT > 0){ slowT = Math.max(0, slowT - real); const k = 1 - slowT/slowDur; ts = .07 + .93*k*k*k; }
  const so = $('slow'); so.style.opacity = slowT > 0 && !cine ? Math.min(1, slowT/slowDur*1.6) : 0;
  if (cine){ cine.t += real; if (cine.t >= cine.dur) cine = null; }
  update(real*ts, now/1000, real);
  renderer.clear();
  renderer.render(envScene, envCam);
  renderer.clearDepth();
  renderer.render(scene, camera);
}
fillField(-170);
updateSkewerShape();
requestAnimationFrame(loop);
setTimeout(buildPlanetTextures, 300);
start();   // no title screen: open straight onto the grill with the gauge running

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  const nt = lanternTexture(); lanternTex.image = nt.image; lanternTex.needsUpdate = true;
});
})();
</script>
