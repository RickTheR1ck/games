<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<style>
:root{--ink:#3d2a2e;--pink:#ff6f91;--pink2:#ffb3c4;--cream:#fff7ec;--mint:#3cc9a4;--shadow:0 4px 0 rgba(61,42,46,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fde4ea;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hide{display:none!important}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#tl{position:absolute;left:12px;top:10px;max-width:calc(100% - 190px)}
#orderName{display:inline-block;background:var(--pink);color:#fff;font-weight:800;font-size:clamp(14px,3.6vw,19px);
  padding:5px 12px;border-radius:999px;box-shadow:var(--shadow)}
#timer{font-size:clamp(30px,8vw,46px);font-weight:900;line-height:1.1;margin-top:4px;text-shadow:0 2px 0 #fff}
#timer.hurry{color:#e08a00}
#timer.bored{color:#8a7a9a;font-size:clamp(20px,5.5vw,30px);margin-top:6px}
#timer small{font-size:.42em;font-weight:800;opacity:.75;margin-left:4px}
@keyframes pulse{to{transform:scale(1.12)}}
#orderDesc{font-size:clamp(11px,3vw,14px);font-weight:700;background:rgba(255,255,255,.82);border-radius:10px;padding:6px 9px;
  line-height:1.5;margin-top:4px;box-shadow:var(--shadow)}
#orderDesc b{color:var(--pink)}
#mini{position:absolute;top:10px;right:10px;border:4px solid #fff;border-radius:14px;box-shadow:var(--shadow);overflow:visible}
#mini .lab{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;
  font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
#accWrap{position:absolute;right:10px;width:150px;background:#fff;border-radius:999px;height:22px;box-shadow:var(--shadow);overflow:hidden}
#accBar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd166,var(--mint));transition:width .15s}
#accTxt{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:900;line-height:22px}
#bottom{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  align-items:flex-end;gap:8px;pointer-events:none;padding:0 8px}
.btn{pointer-events:auto;background:#fff;border-radius:14px;box-shadow:var(--shadow);font-weight:800;font-size:clamp(12px,3.4vw,15px);
  padding:9px 12px;min-width:44px;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(61,42,46,.18)}
.att{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(64px,19vw,86px)}
.att small{font-size:10px;opacity:.6;font-weight:700}
.att.on{background:var(--pink);color:#fff}
.att.on small{opacity:.85}
#finish{position:absolute;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));pointer-events:auto;background:var(--mint);color:#fff}
#mute{position:absolute;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));pointer-events:auto}
#site{position:fixed;right:8px;bottom:2px;font-size:10px;color:var(--ink);opacity:.55;text-decoration:none;pointer-events:auto;z-index:30}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(61,42,46,.88);color:#fff;
  padding:12px 22px;border-radius:16px;font-weight:900;font-size:clamp(18px,5vw,28px);text-align:center;white-space:nowrap;
  transition:opacity .3s}
#banner small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
.pop{position:fixed;font-weight:900;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);
  animation:pop .9s ease-out forwards;text-shadow:0 2px 0 #fff,0 -1px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;z-index:20}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;border-radius:16px;padding:4px 10px;font-size:26px;
  box-shadow:var(--shadow);pointer-events:none}
#bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;
  border-top-color:#fff;border-bottom:0}

/* overlays */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;padding:16px}
#title{background:linear-gradient(180deg,rgba(253,228,234,.15),rgba(253,228,234,.55) 60%,rgba(253,228,234,.9));cursor:pointer}
#title h1{margin:0;font-size:clamp(34px,10vw,72px);font-weight:900;line-height:1.08;text-align:center;color:#f0507c;
  letter-spacing:.02em;background:rgba(255,251,247,.94);border:3px solid #fff;border-radius:clamp(20px,5vw,32px);
  padding:.28em .5em .32em;box-shadow:0 6px 0 rgba(61,42,46,.14),0 14px 36px rgba(61,42,46,.16);
  text-shadow:0 .06em 0 rgba(240,80,124,.22);transform:rotate(-2deg)}
#title h1 span{display:table;margin:0 auto .3em;font-size:.4em;color:#fff;background:var(--ink);padding:.3em .9em;border-radius:999px;
  text-shadow:none;letter-spacing:.04em}
#title .sub{font-weight:800;font-size:clamp(14px,4vw,20px);margin:10px 0 0;background:#fff;padding:4px 14px;border-radius:999px;box-shadow:var(--shadow)}
#title .go{margin-top:auto;background:var(--pink);color:#fff;font-size:clamp(20px,6vw,30px);font-weight:900;padding:14px 38px;
  border-radius:999px;box-shadow:0 6px 0 #c94767;animation:bob 1s infinite ease-in-out alternate}
@keyframes bob{to{transform:translateY(-6px)}}
#title .how{margin-top:14px;font-size:clamp(11px,3vw,13px);font-weight:700;text-align:center;line-height:1.7;background:rgba(255,255,255,.85);
  padding:8px 14px;border-radius:12px;margin-bottom:24px}
#title .top{margin-top:4vh;display:flex;flex-direction:column;align-items:center}
#result{background:none;pointer-events:none;justify-content:flex-end;align-items:stretch;padding:0}
#card{pointer-events:auto;background:var(--cream);border-radius:22px;padding:14px 18px 12px;width:min(360px,92vw);text-align:center;
  box-shadow:0 8px 0 rgba(61,42,46,.25),0 10px 40px rgba(61,42,46,.18);cursor:default;animation:cardIn .35s cubic-bezier(.2,1.4,.4,1);
  max-height:calc(100% - 24px);overflow:auto;touch-action:pan-y}
@keyframes cardIn{from{transform:translateY(30px) scale(.85);opacity:0}}
body.wide #result{justify-content:center;align-items:flex-end;padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:var(--miniH,180px);padding-bottom:12px}
body:not(.wide) #card{width:100%;border-radius:22px 22px 0 0;max-height:min(56vh,440px);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#card.peek{display:none}
#peekBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;display:flex;gap:8px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center;
  pointer-events:auto;align-items:center}
#peekBar .btn{padding:11px 16px;white-space:nowrap}
@media (max-width:640px){#peekBar .cap{display:none}}
#peekBar .cap{background:rgba(61,42,46,.82);color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap}
#rView{background:#fff}
body.resultMode #site,body.resultMode #tip,body.resultMode #bottom,body.resultMode #finish,body.resultMode #accWrap,body.resultMode #steps,body.resultMode #timer,body.resultMode #orderDesc{display:none}
#rOrder{font-weight:800;font-size:13px;opacity:.7}
#rAcc{font-size:clamp(52px,16vw,72px);font-weight:900;line-height:1;color:var(--pink);margin:4px 0}
#rAcc small{font-size:.4em}
#rRank{font-size:clamp(20px,6vw,26px);font-weight:900}
#rCom{font-size:13px;font-weight:700;opacity:.75;margin-top:2px}
#rStats{font-size:12px;font-weight:700;margin-top:10px;background:#fff;border-radius:10px;padding:6px}
.sGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sp{position:relative;background:#fff6ef;border-radius:8px;padding:4px 2px 6px;overflow:hidden;line-height:1.15}
.sp b{display:block;font-size:10px;opacity:.7;white-space:nowrap}
.sp span{font-size:16px;font-weight:900}.sp i{font-size:10px;font-style:normal;opacity:.55}
.sp em{display:block;font-size:10px;font-style:normal;opacity:.7}
.sp u{position:absolute;left:0;bottom:0;height:3px;background:var(--mint);text-decoration:none}
.sBored{margin-top:4px;color:#8a7a9a}
#retryCut{white-space:nowrap;padding-left:8px!important;padding-right:8px!important}.sLine{margin-top:4px;font-size:11px;opacity:.7}
#rBest{font-size:12px;font-weight:800;margin-top:6px}
#rBest .new{color:#fff;background:#ff9f1c;padding:1px 6px;border-radius:6px;margin-left:4px}
#card .row{display:flex;gap:8px;margin-top:12px}
#card .row .btn{flex:1;padding:12px}
#retry{background:var(--pink);color:#fff}
#retryCut{background:#ffe3ea;color:var(--ink);flex:0.8!important}
#share{background:#111;color:#fff}
#card .hint{font-size:11px;opacity:.55;margin-top:8px;font-weight:700}
body:not(.wide) #rAcc{font-size:clamp(42px,12vw,60px)}
body:not(.wide) #rTip{display:none}

#dbg{position:fixed;left:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.93);border-radius:10px;padding:8px 10px;
  font-size:11px;z-index:40;width:220px;box-shadow:var(--shadow);pointer-events:auto}
#dbg label{display:block;margin:3px 0}
#dbg input{width:100%}
#dbg .v{float:right;font-weight:800}

#steps{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
#steps span{font-size:11px;font-weight:800;background:rgba(255,255,255,.85);border-radius:999px;padding:2px 8px;opacity:.55}
#steps span.cur{opacity:1;background:var(--ink);color:#fff}
#steps span.done{opacity:.95;background:#d9f5ec;color:#1f8f71}
#timer.phase{font-size:clamp(20px,5.5vw,30px);margin-top:6px}
#bottom.noatt .att{display:none}
.splash{position:fixed;border-radius:50%;pointer-events:none;z-index:18;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(170,220,255,.6) 40%,rgba(120,190,255,.28) 66%,transparent 70%);
  animation:splash 1.7s ease-out forwards}
@keyframes splash{0%{transform:scale(.2);opacity:0}8%{transform:scale(1.05);opacity:1}65%{opacity:.85}100%{transform:translateY(46px) scale(1);opacity:0}}
#mg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(440px,88vw);
  background:rgba(255,255,255,.92);border-radius:16px;padding:8px 12px 10px;box-shadow:var(--shadow);text-align:center;pointer-events:none}
#mgTitle{font-weight:900;font-size:clamp(13px,3.6vw,16px)}
#mgGauge{position:relative;height:24px;border-radius:999px;background:#f1e6e9;margin:6px 0 4px;overflow:hidden}
#mgGauge.temp{background:linear-gradient(90deg,#7cc4ff,#e9f4ff 45%,#ffe9e2 55%,#ff8a6b)}
#mgZone{position:absolute;top:0;bottom:0;background:rgba(60,201,164,.45);border-left:2px solid var(--mint);border-right:2px solid var(--mint)}
#mgFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd6e1,var(--pink))}
#mgNeedle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:var(--ink);border-radius:3px;box-shadow:0 0 0 2px #fff}
#mgGauge .lab{position:absolute;top:0;font-size:10px;font-weight:800;line-height:24px;opacity:.6}
#mgHint{font-size:clamp(11px,3vw,13px);font-weight:800;opacity:.8}
#mgHint b{color:var(--pink)}
#mgDots{font-size:14px;letter-spacing:4px;margin-top:2px}
body.carePhase #tip,body.carePhase #accWrap{display:none}
#flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:40;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
#rPhoto{background:#fff}
#viewfinder{position:fixed;z-index:11;pointer-events:none;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 200vmax rgba(61,42,46,.28)}
#viewfinder::before,#viewfinder::after{content:"";position:absolute;width:26px;height:26px;border:4px solid var(--pink)}
#viewfinder::before{left:-6px;top:-6px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
#viewfinder::after{right:-6px;bottom:-6px;border-left:0;border-top:0;border-radius:0 0 10px 0}
#viewfinder span{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:rgba(61,42,46,.82);color:#fff;font-size:12px;font-weight:800;
  padding:3px 10px;border-radius:999px;white-space:nowrap}
#peekBar .zoom{padding:11px 14px;font-size:16px;line-height:1}
#breedName{font-size:clamp(11px,3vw,13px);font-weight:800;margin-top:4px;opacity:.75}
#guide{position:fixed;z-index:15;pointer-events:none;background:#fff;border-radius:10px;padding:4px 9px;font-size:13px;font-weight:800;
  box-shadow:var(--shadow);white-space:nowrap;border:2px solid #fff}
#guide.ok{border-color:var(--mint);color:#1f8f71}
#guide.warn{border-color:#ffb020;color:#a76a00}
#guide.bad{border-color:#e63b5f;color:#d02a4f}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));max-width:min(560px,70vw);
  background:rgba(61,42,46,.82);color:#fff;font-size:clamp(11px,3vw,13px);font-weight:700;padding:6px 12px;border-radius:12px;
  text-align:center;transition:opacity .4s;line-height:1.5}
#tip b{color:#ffd166}
#title .btns{display:flex;gap:10px;align-items:center;margin-top:auto;flex-wrap:wrap;justify-content:center}
#title .btns .go{margin-top:0}
#openZ,#rZukan{background:#fff}
#title .tipline{margin-top:10px;font-size:clamp(11px,3vw,13px);font-weight:700;background:rgba(61,42,46,.82);color:#fff;padding:6px 12px;border-radius:10px;max-width:92vw;text-align:center}
#title .tipline b{color:#ffd166}
#rTip{font-size:12px;font-weight:700;margin-top:8px;background:#fff3c4;border-radius:10px;padding:6px 8px;text-align:left;line-height:1.5}
#rNew{font-size:12px;font-weight:900;color:#ff7a00;margin-top:4px;min-height:1em}
#zukan{background:rgba(61,42,46,.45);z-index:25}
#zPanel{background:var(--cream);border-radius:20px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:14px 16px 18px;
  box-shadow:0 8px 0 rgba(61,42,46,.25);touch-action:pan-y;cursor:default}
.zHead{display:flex;align-items:center;gap:10px;font-size:20px;flex-wrap:wrap}
.zHead #zCount{font-size:13px;font-weight:800;opacity:.7}
.zHead #zClose{margin-left:auto}
.zTabs{display:flex;gap:6px;margin:10px 0}
.zt.on{background:var(--pink);color:#fff}
.zGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.zCard{background:#fff;border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.zPhoto{width:100%;aspect-ratio:4/3;border-radius:10px;background:#f3e6dc;display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#c9b3a6;overflow:hidden}
.zPhoto img{width:100%;height:100%;object-fit:cover;display:block}
.zName{font-weight:900;font-size:15px;margin-top:6px}
.zInfo{font-size:11px;font-weight:700;opacity:.75;line-height:1.5;margin-top:2px}
.zBest{font-size:12px;font-weight:800;margin-top:4px}
.zMedals{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.zMedals span{font-size:10px;font-weight:800;background:#f6eee8;border-radius:6px;padding:2px 5px}
.zMedals span.got{background:#fff0c2}
.zTitles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.zTitle{background:#fff;border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);font-weight:900}
.zTitle small{display:block;font-size:11px;font-weight:700;opacity:.65;margin-top:2px}
.zTitle.locked{opacity:.55}
.zTips{margin:0;padding-left:1.3em;font-weight:700;font-size:13px;line-height:1.8}

@media (max-width:600px){
  #tl{max-width:calc(100% - 120px);left:10px;top:8px}
  #orderName{font-size:13px;padding:4px 10px}
  #breedName,#steps,#tip{display:none!important}
  #timer{font-size:28px;margin-top:2px}
  #timer.phase,#timer.bored{font-size:18px}
  #orderDesc{font-size:11px;padding:4px 8px;line-height:1.4;margin-top:2px}
  body.carePhase #orderDesc{display:none}
  #mini .lab{font-size:10px;padding:1px 7px}
  #banner{font-size:18px;padding:8px 16px;top:36%}
  .att{min-width:0;flex:1;max-width:96px;padding:8px 6px}
  .att small{display:none}
  #bottom{gap:6px}
  #bottom .btn{padding:8px 10px}
  .btn{min-height:44px}
  #bottom .btn,#finish,#mute{min-width:44px}
  .att{max-width:104px}
  /* ミニゲーム中：パネルを一番下に、ボタンはその上 */
  body.carePhase #bottom{display:none}
  body.carePhase #mg{bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);padding:6px 10px 8px}
  body.carePhase #finish,body.carePhase #mute{bottom:calc(122px + env(safe-area-inset-bottom))}
  #mgHint{font-size:11px}
  #finish{right:10px;padding:8px 12px;bottom:calc(66px + env(safe-area-inset-bottom))}
  #mute{left:10px;padding:8px 10px;bottom:calc(66px + env(safe-area-inset-bottom))}
  .pop{font-size:clamp(16px,6vw,26px)!important}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="tl">
    <div id="orderName">テディベアカット</div>
    <div id="breedName"></div>
    <div id="steps"></div>
    <div id="timer">60</div>
    <div id="orderDesc"></div>
  </div>
  <div id="mini"><div class="lab">ご注文</div></div>
  <div id="accWrap"><div id="accBar"></div><div id="accTxt">一致度 0%</div></div>
  <button class="btn" id="mute" title="ミュート (M)">🔊</button>
  <button class="btn" id="finish">仕上げ✂</button>
  <div id="bottom">
    <button class="btn" id="rotL" aria-label="左に回す">⟲</button>
    <button class="btn att" data-a="0">つるつる<small>1</small></button>
    <button class="btn att on" data-a="1">みじかめ<small>2</small></button>
    <button class="btn att" data-a="2">ながめ<small>3</small></button>
    <button class="btn" id="rotR" aria-label="右に回す">⟳</button>
  </div>
  <div id="tip"></div>
  <div id="mg" class="hide">
    <div id="mgTitle"></div>
    <div id="mgGauge"><div id="mgZone"></div><div id="mgFill"></div><div id="mgNeedle"></div><span class="lab" style="left:8px" id="mgL"></span><span class="lab" style="right:8px" id="mgR"></span></div>
    <div id="mgHint"></div><div id="mgDots"></div>
  </div>
  <div id="banner" class="hide"></div>
</div>

const dTouch = (type, x, y) => canvas.dispatchEvent(new PointerEvent('pointer' + type, { clientX: x, clientY: y, pointerId: 9, pointerType: 'touch', isPrimary: true, bubbles: true, button: 0, buttons: type === 'up' ? 0 : 1 }));
function demoTarget() {
  const v = new THREE.Vector3();
  dog.root.updateMatrixWorld(true);
  for (let tries = 0; tries < 500; tries++) {
    const g = (Math.random() * 3) | 0, G = dog.groups[g]; if (!G.n) continue; const i = (Math.random() * G.n) | 0;
    if (G.len[i] - G.tg[i] < 0.08 || G.tg[i] > 0.4) continue;
    let edge = false; const rx = G.root[i * 3], ry = G.root[i * 3 + 1], rz = G.root[i * 3 + 2], R2 = Math.pow(P.cutRadius * 1.7, 2);
    for (let q = 0; q < 160 && !edge; q++) { const j = (Math.random() * G.n) | 0; if (G.tg[j] > G.tg[i] + 0.05 && (G.root[j * 3] - rx) ** 2 + (G.root[j * 3 + 1] - ry) ** 2 + (G.root[j * 3 + 2] - rz) ** 2 < R2) edge = true; }
    if (edge) continue;
    v.set(rx, ry, rz); G.obj.localToWorld(v);
    _dw.set(G.dir[i * 3], G.dir[i * 3 + 1], G.dir[i * 3 + 2]).transformDirection(G.obj.matrixWorld);
    if (_dw.dot(v.clone().sub(camera.position).normalize()) > 0.05) continue;
    v.project(camera); const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight;
    if (!isFinite(x) || x < 30 || x > innerWidth - 30 || y < 90 || y > innerHeight - 140) continue;

}
async function demoCutFor(ms) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms && state === 'play') {
    if (shakeState !== 0) { await dSleep(50); continue; }
    const b = demoTarget(); if (!b) { cam.theta += 0.5; await dSleep(120); continue; }
    if (b.a >= 0 && b.a !== attIdx) setAtt(b.a);
    const ang = Math.random() * Math.PI * 2, dx = Math.cos(ang) * 9, dy = Math.sin(ang) * 6;
    dTouch('down', b.x, b.y); await dSleep(160); // 指を置いてから刈り始めるまでの待ち
    for (let k = 1; k <= 7; k++) { dTouch('move', b.x + dx * k, b.y + dy * k); await dSleep(22); if (shakeState !== 0) break; }
    dTouch('up', b.x + dx * 7, b.y + dy * 7); await dSleep(40);
  }
}
async function demoCut() {
  window.__demo = true;
  lastCare = { clean: 0.96, fluffy: 0.95 };
  startRound(true);
  $('banner').classList.add('hide');
  cam.dist = baseDist; cam.theta = 0.75; cam.phi = 1.1;
  await dSleep(250);
  await demoCutFor(3200);                         // つかみ：いきなりバリカンで毛がドサドサ
  startMischief('shake'); await dSleep(300);       // ❗→ブルブル
  while (shakeState !== 0) await dSleep(50);
  await demoCutFor(2800);
  cam.theta -= 0.9; await dSleep(200);
  await demoCutFor(1800);
  startMischief('sneeze');                         // ハ…ハ…ハックション！
  while (shakeState !== 0) await dSleep(50);
  await demoCutFor(2600);
  // わざと1回、切っちゃダメな毛を刈って「キャン！」
  const v = new THREE.Vector3(); let hit = null;
  for (let t = 0; t < 600 && !hit; t++) {
    const g = (Math.random() * 3) | 0, G = dog.groups[g]; if (!G.n) continue; const i = (Math.random() * G.n) | 0;
    if (G.tg[i] < 0.5 || G.len[i] < 0.3) continue;
    v.set(G.root[i * 3], G.root[i * 3 + 1], G.root[i * 3 + 2]); G.obj.localToWorld(v);
    _dw.set(G.dir[i * 3], G.dir[i * 3 + 1], G.dir[i * 3 + 2]).transformDirection(G.obj.matrixWorld);
    if (_dw.dot(v.clone().sub(camera.position).normalize()) > 0) continue;
    v.project(camera); const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight;
    if (x > 40 && x < innerWidth - 40 && y > 120 && y < innerHeight - 160) hit = { x, y };
  }
  if (hit) { setAtt(0); dTouch('down', hit.x, hit.y); await dSleep(160); for (let k = 1; k <= 6; k++) { dTouch('move', hit.x + k * 7, hit.y + k * 3); await dSleep(25); } dTouch('up', hit.x + 42, hit.y + 18); }
  await dSleep(900);

}
async function demoDry() {
  window.__demo = true;
  startRound(false); $('banner').classList.add('hide');
  for (const G of dog.groups) for (let i = 0; i < G.n; i++) { G.wet[i] = 1; G.dirt[i] *= 0.1; G.foam[i] = 2; setState(G, i); }
  clearFoam(); careQ.shampoo = 1; careQ.rinse = 1;

// ===================== 起動 =====================
setMuted(muted);
breed = pickBreed(); rebuild(); layout();
let last = performance.now(), perfT = 0, perfN = 0;
function frame(now) {

  if (window.__sim) return; // シミュレーションテスト中は、テスト側が時間を進める

  // 重さの自動チェック：遊んでいる間の平均fpsが低ければ、次のラウンドから毛を減らす

    if (f < 34 && P.strands > 1400) { P.strands = Math.max(1400, Math.round(P.strands * 0.7)); lsSet('mosamosa_strands', P.strands); console.log('[perf] ' + f.toFixed(0) + 'fps → 毛を ' + P.strands + ' 束に減らします'); } } }
  if (DEBUG) { fpsT += dt; fpsN++; if (fpsT > 0.5) { fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; const f = $('fps'); if (f) f.textContent = fps + 'fps'; } }
}
requestAnimationFrame(frame);
if (location.hash.startsWith('#autotest')) setTimeout(runAutotest, 500);
if (location.hash.startsWith('#simtest')) setTimeout(runSimtest, 800);
